name: IPD PR13 text clipping verification TEMP
on:
  push:
    branches: [qa/chauffeur-quote-clarity-2026-10-24]
    paths: [.github/workflows/ipd-pr13-text-geometry-temp.yml]
permissions:
  contents: read
jobs:
  verify-visible-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browsers
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium webkit
      - name: Measure individual text fragments and clipped ancestors on full page
        run: |
          python - <<'PY'
          import hashlib,json,re,threading,urllib.parse,subprocess
          from pathlib import Path
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          root=Path.cwd()
          path=root/'chauffeur-service/index.html'
          raw=path.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='cf1cb3a4c73c05f34390fc4c1f19b2ce371dd3c3',blob
          css="""
          body .btn {min-height:44px!important}
          body .btn:focus-visible {outline:3px solid #1a1814!important;outline-offset:3px!important}
          body .hero .btn:focus-visible,body .final .btn:focus-visible {outline-color:#c9a96e!important}
          @media(max-width:320px){
          .wrap{padding-left:12px;padding-right:12px}
          .top .wrap{flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem;padding-top:9px;padding-bottom:9px}
          .top .wrap>.brand{max-width:100%;text-align:center;overflow-wrap:anywhere}
          .top .nav{flex:1 1 100%;min-width:0;justify-content:center;flex-wrap:wrap}
          .top .nav .btn{max-width:100%;text-align:center;overflow-wrap:anywhere;white-space:normal;padding:8px 10px}
          .grid,.steps,.links,.trust,.ipd-photo-proof__grid{grid-template-columns:minmax(0,1fr)}
          .trust div,.trust div:nth-child(2){border-right:0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
          .trust div:last-child{border-bottom:0}
          .card,.step,.links a{min-width:0;overflow-wrap:anywhere;padding:16px}
          .hero h1{font-size:clamp(1.85rem,10vw,2.5rem)!important;overflow-wrap:anywhere}
          h2{font-size:clamp(1.65rem,8vw,2.25rem)!important;overflow-wrap:anywhere}
          h3{font-size:1.5rem!important;overflow-wrap:anywhere}
          .service-languages a,.hero p,.eyebrow,.lead,.final p,.faq summary,.footerlinks a,.crumb,.ipd-photo-proof figcaption,.ipd-photo-proof__map{overflow-wrap:anywhere;min-width:0}
          .actions .btn{padding:10px 8px;overflow-wrap:anywhere}
          }
          """
          text=raw.decode()
          good='Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600'
          bad='Cormorant+Garamond:wght;500;600&amp;family=Manrope:wght;400;500;600'
          assert text.count(bad)==1
          patch='<style id="qa-temporary">'+css+'</style>'
          tested=text.replace(bad,good).replace('</head>',patch+'</head>')
          assert tested.replace(patch,'').replace(good,bad)==text
          strip=lambda s:re.sub(r'<script\b(?![^>]*application/ld\+json)[^>]*>.*?</script>','',s,flags=re.S|re.I)
          versions={'head':strip(text),'patched':strip(tested)}
          class Handler(SimpleHTTPRequestHandler):
            def __init__(self,*a,**kw):super().__init__(*a,directory=str(root),**kw)
            def log_message(self,*a):pass
            def do_GET(self):
              p=urllib.parse.urlparse(self.path).path
              if p.startswith('/__qa/'):
                variant=p.split('/')[2]
                if variant not in versions:self.send_error(404);return
                data=versions[variant].encode()
                self.send_response(200);self.send_header('Content-Type','text/html;charset=utf-8');self.send_header('Content-Length',str(len(data)))
                self.end_headers();self.wfile.write(data);return
              super().do_GET()
          server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          origin='http://127.0.0.1:'+str(server.server_address[1])
          inspect=r"""() => {
            const width=document.documentElement.clientWidth,scroll=document.documentElement.scrollWidth;
            const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[],fail=[];
            let n,count=0,fragments=0,hidden=0;
            while((n=w.nextNode())){
              if(!n.data.trim())continue;
              const el=n.parentElement,s=getComputedStyle(el);
              if(s.display==='none'||s.visibility==='hidden'||s.opacity==='0') {hidden++;continue;}
              const range=document.createRange();range.selectNodeContents(n);
              const rectangles=[...range.getClientRects()].filter(r=>r.width>0.25&&r.height>0.25);
              if(!rectangles.length)continue;
              count++;
              for(const r of rectangles){
                fragments++;
                if(r.left<-1||r.right>width+1){
                  fail.push({type:'viewport',text:n.data.trim().slice(0,95),element:el.tagName,cls:el.className?.toString().slice(0,70),left:+r.left.toFixed(1),right:+r.right.toFixed(1),width});
                }
                let a=el;
                while(a&&a!==document.body){
                  const z=getComputedStyle(a);
                  if(['hidden','clip'].includes(z.overflowX)){
                    const box=a.getBoundingClientRect();
                    if(r.left<box.left-1||r.right>box.right+1){
                      fail.push({type:'ancestor-clip',text:n.data.trim().slice(0,95),container:a.tagName,containerClass:a.className?.toString().slice(0,60),left:+r.left.toFixed(1),right:+r.right.toFixed(1),boxLeft:+box.left.toFixed(1),boxRight:+box.right.toFixed(1)});
                      break;
                    }
                  }
                  a=a.parentElement;
                }
              }
            }
            return {width,scroll,overflow:scroll-width,nodes:count,fragments,hidden,clipped:fail.slice(0,80),clipCount:fail.length,fonts:[...document.fonts].filter(f=>f.status==='loaded').map(f=>f.family),ctas:[...document.querySelectorAll('a[href^="https://wa.me/"]')].length,images:[...document.images].map(i=>i.complete&&i.naturalWidth>0)};
          }"""
          rows=[]
          try:
            with sync_playwright() as p:
              for engine in ('chromium','webkit'):
                browser=getattr(p,engine).launch(headless=True)
                try:
                  for width in (187,220,375,440):
                    for variant in ('head','patched') if width==187 else ('patched',):
                      ctx=browser.new_context(viewport={'width':width,'height':840},service_workers='block')
                      def route(req):
                        u=req.request.url
                        if req.request.method!='GET':return req.abort()
                        if u.startswith(origin+'/') and not u.endswith('/analytics.js'):return req.continue_()
                        if u.startswith('https://fonts.googleapis.com/') or u.startswith('https://fonts.gstatic.com/'):return req.continue_()
                        return req.abort()
                      ctx.route('**/*',route)
                      page=ctx.new_page();page.goto(origin+'/__qa/'+variant+'/chauffeur-service/',wait_until='load')
                      page.evaluate("() => [...document.images].forEach(i=>i.loading='eager')")
                      page.wait_for_function("() => [...document.images].every(i=>i.complete&&i.naturalWidth>0)")
                      page.evaluate("() => document.fonts.ready")
                      value=page.evaluate(inspect)
                      rows.append({'engine':engine,'initialWidth':width,'variant':variant,**value})
                      ctx.close()
                finally:browser.close()
          finally:server.shutdown();server.server_close()
          Path('text-geometry-result.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          for x in rows:print('TEXT_GEOMETRY='+json.dumps(x,ensure_ascii=False),flush=True)
          if any(x['clipCount'] or x['overflow'] for x in rows if x['variant']=='patched'):
            print('CANDIDATE NOT APPROVED: measured text clipping or overflow',flush=True)
            raise SystemExit(2)
          print('PASS: all measured text ranges fit in Chromium and WebKit at 187-440px; NOT NATIVE SAFARI, NOT DEPLOYED',flush=True)
          PY
      - name: Save targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-pr13-text-geometry
          path: text-geometry-result.json
          if-no-files-found: warn
          retention-days: 7
