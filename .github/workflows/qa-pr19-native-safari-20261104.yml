name: PR19 native Safari local airport font and real 200 percent reflow QA
on:
  push:
    branches: [qa/airport-pr19-cross-browser-20261104]
    paths: [.github/workflows/qa-pr19-native-safari-20261104.yml]
permissions:
  contents: read
jobs:
  native-safari-zoom:
    runs-on: macos-26-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Quartz native UI controller
        run: python -m pip install --quiet pyobjc-framework-Quartz pyobjc-framework-Cocoa
      - name: Prove real Safari 200 percent zoom and real font loading with no external browser requests
        run: |
          python - <<'PY'
          import hashlib,html,json,re,subprocess,threading,time,traceback,urllib.request
          from pathlib import Path
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from urllib.parse import urlsplit
          import AppKit,Quartz

          root=Path.cwd()
          out=Path('/tmp/qa-pr19-native-safari-20261104');out.mkdir(exist_ok=True)
          raw=(root/'airport-transfers/index.html').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='9ab03fbb6a4657ade95c94d3c6ade2db3e4bcf82','unexpected PR19 candidate'
          report={'method':'genuine macOS Safari via LaunchServices + Quartz; local-only strict CSP, no WebDriver','blob':blob,'checks':[],'errors':[]}
          assets={}
          source=raw.decode()
          font_match=re.search(r'https://fonts.googleapis.com/css2[^"]+',source)
          assert font_match,'Google Font CSS link missing'
          font_url=html.unescape(font_match.group())
          assert 'wght@' in font_url,'Malformed Google Fonts URL still present'
          ua='Mozilla/5.0 (Macintosh; Intel Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Safari/605.1.15'
          def getfont(url):
              assert url.startswith(('https://fonts.googleapis.com/','https://fonts.gstatic.com/'))
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=25) as r:
                  assert r.status==200
                  return r.read()
          css=getfont(font_url).decode()
          assert '@font-face' in css
          for i,url in enumerate(dict.fromkeys(re.findall(r'url\((https://fonts.gstatic.com/[^)]+)\)',css))):
              local='/__font/'+str(i)+'.woff2'
              assets[local]=(getfont(url),'font/woff2')
              css=css.replace(url,local)
          assets['/__fonts.css']=(css.encode(),'text/css')
          doc=source.replace(font_match.group(),'/__fonts.css')
          doc=re.sub(r'<script\b[^>]*src="https://www\.googletagmanager\.com/[^"]+"[^>]*></script>','',doc,flags=re.I)
          assert 'src="/analytics.js"' in doc
          extra=r"""<script>
          let latestAck='',errors=[];
          const cta=()=>document.querySelector('header.hero .actions a[href^="https://wa.me/"]');
          const photo=()=>document.querySelector('.ipd-photo-proof img');
          function metrics(){
            const a=cta(),r=a?.getBoundingClientRect(),cx=r?Math.max(1,Math.min(innerWidth-2,r.left+r.width/2)):1,cy=r?Math.max(1,Math.min(innerHeight-2,r.top+r.height/2)):1;
            const hit=document.elementFromPoint(cx,cy);
            const h1=document.querySelector('h1'),f=e=>e?{family:getComputedStyle(e).fontFamily,weight:getComputedStyle(e).fontWeight}:null;
            return {ack:latestAck,ua:navigator.userAgent,iw:innerWidth,ih:innerHeight,dpr:devicePixelRatio,
              client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth,
              h1Text:h1?.textContent.trim(),h1:f(h1),body:f(document.body),
              fonts:[...document.fonts].filter(x=>x.status==='loaded').map(x=>x.family),
              photo:!!photo()&&photo().complete&&photo().naturalWidth>0,
              faq:document.querySelectorAll('#faq details[open]').length,
              cta:{found:!!a,focused:a===document.activeElement,rect:r?{x:r.x,y:r.y,w:r.width,h:r.height}:null,
                hit:!!a&&!!hit&&(hit===a||a.contains(hit)),
                inViewport:!!r&&r.top>=0&&r.bottom<=innerHeight},
              external:performance.getEntriesByType('resource').filter(x=>!x.name.startsWith(location.origin)).map(x=>x.name),
              errors};
          }
          async function poll(){
            try{
              const c=await fetch('/__command').then(r=>r.json());
              if(c.op==='focus'){const a=cta();if(!a)throw Error('CTA missing');a.scrollIntoView({block:'center',behavior:'instant'});a.focus();}
              if(c.op==='faq'){document.querySelector('#faq summary')?.click();}
              if(c.op==='photo'){photo()?.scrollIntoView({block:'center',behavior:'instant'});}
              if(c.op==='top')scrollTo({top:0,left:0,behavior:'instant'});
              latestAck=c.id||latestAck;
              await document.fonts.ready;
              await fetch('/__metrics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(metrics())});
            }catch(e){errors.push(String(e));}
            setTimeout(poll,140);
          }
          poll();
          </script>"""
          doc=doc.replace('</body>',extra+'</body>')
          policy="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'"
          queue=[];latest={};samples=[]
          class Handler(SimpleHTTPRequestHandler):
              def __init__(self,*args,**kw):super().__init__(*args,directory=str(root),**kw)
              def log_message(self,*args):pass
              def end_headers(self):
                  self.send_header('Content-Security-Policy',policy);self.send_header('Cache-Control','no-store');super().end_headers()
              def send(self,b,mime):
                  self.send_response(200);self.send_header('Content-Type',mime);self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
              def do_GET(self):
                  p=urlsplit(self.path).path
                  if p=='/airport-transfers/':return self.send(doc.encode(),'text/html; charset=utf-8')
                  if p=='/__command':return self.send(json.dumps(queue.pop(0) if queue else {}).encode(),'application/json')
                  if p in assets:return self.send(*assets[p])
                  if p=='/analytics.js' or p.startswith(('/assets/','/images/')):return super().do_GET()
                  self.send_error(404)
              def do_POST(self):
                  if self.path!='/__metrics':return self.send_error(405)
                  n=int(self.headers.get('Content-Length',0));d=json.loads(self.rfile.read(n))
                  latest.clear();latest.update(d);samples.append(d)
                  self.send(b'{}','application/json')
          server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          def check(name,ok,detail=None):
              report['checks'].append({'name':name,'passed':bool(ok),'detail':detail})
              print(('PASS ' if ok else 'FAIL ')+name+' '+str(detail)[:220],flush=True)
              if not ok:raise AssertionError(name+' '+str(detail)[:400])
          def wait_for(pred,seconds=25):
              until=time.monotonic()+seconds
              while time.monotonic()<until:
                  if latest and pred(latest):return dict(latest)
                  time.sleep(.12)
              raise TimeoutError('Safari did not provide expected local telemetry: '+str(latest)[:300])
          def command(op):
              id=str(time.monotonic_ns());queue.append({'op':op,'id':id})
              return wait_for(lambda x:x.get('ack')==id)
          def key(code,flags=0):
              apps=AppKit.NSRunningApplication.runningApplicationsWithBundleIdentifier_('com.apple.Safari')
              check('native Safari is running',bool(apps))
              apps[0].activateWithOptions_(AppKit.NSApplicationActivateIgnoringOtherApps)
              deadline=time.monotonic()+5
              while time.monotonic()<deadline:
                  front=AppKit.NSWorkspace.sharedWorkspace().frontmostApplication()
                  if front and front.bundleIdentifier()=='com.apple.Safari':break
                  time.sleep(.1)
              else:raise RuntimeError('Safari not foreground')
              mods=[(55,Quartz.kCGEventFlagMaskCommand),(58,Quartz.kCGEventFlagMaskAlternate),(56,Quartz.kCGEventFlagMaskShift)]
              def emit(c,down,f):
                  e=Quartz.CGEventCreateKeyboardEvent(None,c,down);Quartz.CGEventSetFlags(e,f);Quartz.CGEventPost(Quartz.kCGHIDEventTap,e);time.sleep(.07)
              held=[];current=0
              try:
                  for c,f in mods:
                      if flags&f:current|=f;held.append((c,f));emit(c,True,current)
                  emit(code,True,current);emit(code,False,current)
              finally:
                  for c,f in reversed(held):current &= ~f;emit(c,False,current)
              time.sleep(.35)
          def capture(name):
              try:
                  wins=[dict(x) for x in Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly,Quartz.kCGNullWindowID) if x.get('kCGWindowOwnerName')=='Safari' and x.get('kCGWindowLayer')==0 and x.get('kCGWindowBounds',{}).get('Width',0)>300]
                  if wins:
                      target=out/(name+'.png')
                      p=subprocess.run(['screencapture','-x','-l',str(wins[0]['kCGWindowNumber']),str(target)],capture_output=True,text=True,timeout=7)
                      report.setdefault('screenshots',[]).append({'label':name,'created':p.returncode==0 and target.exists()})
              except Exception as e:report.setdefault('captureErrors',[]).append(str(e))
          try:
              check('native keyboard access',bool(Quartz.CGPreflightPostEventAccess()))
              u='http://127.0.0.1:'+str(server.server_port)+'/airport-transfers/'
              p=subprocess.run(['open','-a','Safari',u],capture_output=True,text=True,timeout=12)
              check('Safari opened local airport candidate',p.returncode==0,p.stderr)
              d=wait_for(lambda m:'Safari/' in m.get('ua','') and m.get('cta',{}).get('found'),40)
              check('correct airport H1',d['h1Text']=='Private Ibiza Airport Transfer — Mercedes-Benz V-Class Pickup',d['h1Text'])
              check('Cormorant + Manrope actually loaded',any('Cormorant' in f for f in d['fonts']) and any('Manrope' in f for f in d['fonts']),d['fonts'])
              check('heading uses Cormorant',d['h1'] and 'Cormorant Garamond' in d['h1']['family'],d['h1'])
              check('body uses Manrope',d['body'] and 'Manrope' in d['body']['family'],d['body'])
              q=command('faq');check('FAQ expands via local script',q['faq']>=1,q['faq'])
              im=command('photo');im=wait_for(lambda x:x.get('photo') is True,15);check('original real V-Class photo loads',im['photo'],im['photo'])
              key(29,Quartz.kCGEventFlagMaskCommand)
              base=command('focus')
              check('booking CTA unobscured and focused at 100%',base['cta']['hit'] and base['cta']['focused'] and base['cta']['inViewport'],base['cta'])
              check('no horizontal overflow at 100%',base['scroll']<=base['client']+1,(base['client'],base['scroll']))
              capture('airport-100pct')
              zoom=None
              for _ in range(8):
                  key(24,Quartz.kCGEventFlagMaskCommand)
                  zoom=command('focus')
                  if base['iw']/zoom['iw']>=1.98:break
              ratio=base['iw']/zoom['iw']
              check('genuine Safari 200% zoom with CSS viewport halving',1.98<=ratio<=2.04,{'ratio':ratio,'before':base['iw'],'after':zoom['iw'],'beforeDpr':base['dpr'],'afterDpr':zoom['dpr']})
              check('no horizontal overflow at true 200% zoom',zoom['scroll']<=zoom['client']+1,(zoom['client'],zoom['scroll']))
              check('booking CTA unobscured at true 200%',zoom['cta']['hit'] and zoom['cta']['focused'] and zoom['cta']['inViewport'],zoom['cta'])
              check('fonts retained at true 200%',any('Cormorant' in f for f in zoom['fonts']) and any('Manrope' in f for f in zoom['fonts']),zoom['fonts'])
              check('no offsite browser requests',not zoom['external'],zoom['external'])
              check('no injected script errors',not zoom['errors'],zoom['errors'])
              capture('airport-native-200pct')
              report['result']='NATIVE_SAFARI_200_PERCENT_PASS_NOT_RELEASE_APPROVAL'
          except Exception as e:
              report['errors'].append(str(e));report['traceback']=traceback.format_exc();report['result']='INCOMPLETE'
              capture('airport-failure')
          finally:
              report['lastTelemetry']=dict(latest)
              report['telemetryCount']=len(samples)
              (out/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False,default=str))
              server.shutdown()
              print('SAFARI_RESULT',json.dumps({'result':report['result'],'passed':len([c for c in report['checks'] if c['passed']]),'total':len(report['checks']),'errors':report['errors'],'blob':blob}),flush=True)
          if report['errors']:raise SystemExit(1)
          PY
      - name: Upload native Safari evidence without changing repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airport-pr19-native-safari-zoom
          path: /tmp/qa-pr19-native-safari-20261104/
          retention-days: 7
          if-no-files-found: warn
