name: One-time metadata cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-metadata-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shorten SEO titles and descriptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement in {path}, got {count}')
              p.write_text(new, encoding='utf-8')

          # Main service hub
          replace_once('services/index.html', r'<title>[^<]*</title>', '<title>Private Driver Services Ibiza | Chauffeur & Transfers</title>', 'services title')
          replace_once('services/index.html', r'<meta name="description" content="[^"]*">', '<meta name="description" content="Explore Ibiza private driver services for chauffeur hire, airport transfers, villas, yachts, hotels, nightlife, private aviation and tailored itineraries.">', 'services meta')
          replace_once('services/index.html', r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="Private Driver Services Ibiza | Chauffeur & Transfers">', 'services og title')

          # Detailed private-driver page
          replace_once('services/private-driver-ibiza.html', r'<title>[^<]*</title>', '<title>Private Driver Ibiza | Transfers & Tailored Itineraries</title>', 'private driver title')
          replace_once('services/private-driver-ibiza.html', r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="Private Driver Ibiza | Transfers & Tailored Itineraries">', 'private driver og title')

          # English private aviation page
          replace_once('private-aviation-chauffeur-ibiza/index.html', r'<title>[^<]*</title>', '<title>Private Aviation Chauffeur Ibiza | Jet Ground Transport</title>', 'aviation title')
          replace_once('private-aviation-chauffeur-ibiza/index.html', r'<meta name="description" content="[^"]*">', '<meta name="description" content="Pre-book private chauffeur ground transport in Ibiza for private aviation passengers, crew and travel teams, with hotel, villa and marina connections.">', 'aviation meta')
          replace_once('private-aviation-chauffeur-ibiza/index.html', r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="Private Aviation Chauffeur Ibiza | Jet Ground Transport">', 'aviation og title')

          # Venue/hotel pages with descriptions just over the preferred snippet length.
          descriptions = {
              'private-driver-dc10-ibiza/index.html': 'Pre-book a private driver to DC-10 Ibiza in Sant Josep from hotels, villas, Ibiza Airport or marinas, with outbound and late-night return transport.',
              'private-driver-nobu-hotel-ibiza/index.html': 'Pre-book a private driver to Nobu Hotel Ibiza Bay in Talamanca from Ibiza Airport, villas or marinas, with return and chauffeur options.',
              'private-driver-ibiza-gran-hotel/index.html': 'Pre-book a private driver to Ibiza Gran Hotel from Ibiza Airport, villas, marinas or nightlife venues, with return and chauffeur options.',
              'private-driver-standard-ibiza/index.html': 'Pre-book a private driver to The Standard Ibiza from Ibiza Airport, villas, marinas or nightlife venues, with return and chauffeur options.',
              'private-driver-blue-marlin-ibiza/index.html': 'Pre-book a private driver to Blue Marlin Ibiza from hotels, villas, Ibiza Airport or marinas, with outbound and return transport planned.',
          }
          for path, description in descriptions.items():
              replace_once(path, r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{description}">', f'{path} meta')

          replace_once('private-driver-destino-five-ibiza/index.html', r'<title>[^<]*</title>', '<title>Private Driver to Destino Five Ibiza | Cap Martinet Driver</title>', 'Destino title')
          replace_once('private-driver-destino-five-ibiza/index.html', r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="Private Driver to Destino Five Ibiza | Cap Martinet Driver">', 'Destino og title')

          # These three pages receive meaningful metadata changes today; keep sitemap freshness truthful.
          for sitemap_name in ('sitemap.xml', 'sitemap-priority.xml'):
              p = Path(sitemap_name)
              text = p.read_text(encoding='utf-8')
              for url_path in ('services/', 'services/private-driver-ibiza.html', 'private-aviation-chauffeur-ibiza/'):
                  pattern = rf'(<loc>https://ibizaprivatedrivers\.com/{re.escape(url_path)}</loc><lastmod>)[^<]+(</lastmod>)'
                  text, count = re.subn(pattern, rf'\g<1>2026-09-17\g<2>', text, count=1)
                  if count != 1:
                      raise SystemExit(f'Could not update {url_path} in {sitemap_name}')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit metadata fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services private-aviation-chauffeur-ibiza private-driver-dc10-ibiza private-driver-nobu-hotel-ibiza private-driver-ibiza-gran-hotel private-driver-standard-ibiza private-driver-blue-marlin-ibiza private-driver-destino-five-ibiza sitemap.xml sitemap-priority.xml
          git commit -m 'Tighten SEO titles and descriptions on priority pages'
          git push
