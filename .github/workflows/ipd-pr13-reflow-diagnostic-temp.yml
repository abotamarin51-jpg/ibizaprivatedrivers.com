name: IPD PR13 Responsive Reflow Diagnostic Temporary
on:
  push:
    branches:
      - qa/chauffeur-quote-clarity-2026-10-24
    paths:
      - .github/workflows/ipd-pr13-reflow-diagnostic-temp.yml
permissions:
  contents: read
jobs:
  real-browser-reflow-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium GUI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth
          python -m pip install --quiet playwright pyautogui python-xlib
          python -m playwright install --with-deps chromium
      - name: Reflow diagnostics at TRUE browser UI zoom 200pct
        run: |
          xvfb-run -a -s "-screen 0 1800x1200x24" python - <<'PY'
          import json, re, subprocess, threading
          from pathlib import Path
          from urllib.parse import urlsplit
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          import pyautogui

          root=Path.cwd().resolve()
          pagefile="chauffeur-service/index.html"
          subprocess.run(["git","fetch","--quiet","--depth=1","origin","main"],check=True)
          main_sha=subprocess.check_output(["git","rev-parse","FETCH_HEAD"],text=True).strip()
          assert main_sha=="8f1a230b8339bf13535e3d4e8a01ec3fa7d1b534",main_sha
          baseline=subprocess.check_output(["git","show","FETCH_HEAD:"+pagefile],text=True)
          candidate=(root/pagefile).read_text()
          old="%0AItinerary%3A%0APassengers%3A"
          new="%0AItinerary%3A%0AFinal%20return%3A%0APassengers%3A%0ALuggage%3A"
          assert candidate.replace(new,old)==baseline
          assert candidate.count(new)==3
          blob=subprocess.check_output(["git","hash-object",pagefile],text=True).strip()
          assert blob=="cf1cb3a4c73c05f34390fc4c1f19b2ce371dd3c3",blob
          def isolate(s):
            s=re.sub(r"<script\b(?![^>]*application/ld\+json)[^>]*>.*?</script>","",s,flags=re.S|re.I)
            s=re.sub(r'<link\b[^>]*href="https?://[^"]+"[^>]*>',"",s,flags=re.I)
            return s
          files={"baseline":isolate(baseline),"candidate":isolate(candidate)}
          css="""
          @media (max-width: 320px) {
            .wrap {padding-left:12px; padding-right:12px;}
            .top .wrap {flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem;padding-top:9px;padding-bottom:9px}
            .top .wrap>.brand {max-width:100%;text-align:center;overflow-wrap:anywhere}
            .top .nav {flex:1 1 100%;min-width:0;justify-content:center;flex-wrap:wrap}
            .top .nav .btn {max-width:100%;text-align:center;overflow-wrap:anywhere;white-space:normal;padding:8px 10px}
            .grid,.steps,.links {grid-template-columns:minmax(0,1fr)}
            .card,.step,.links a {min-width:0;overflow-wrap:anywhere;padding:16px}
            .hero h1 {font-size:clamp(1.85rem,10vw,2.5rem)!important;overflow-wrap:anywhere}
            h2 {font-size:clamp(1.65rem,8vw,2.25rem)!important;overflow-wrap:anywhere}
            h3 {font-size:1.5rem!important;overflow-wrap:anywhere}
            .service-languages a,.hero p,.eyebrow,.lead,.final p,.faq summary,.footerlinks a,.crumb,.ipd-photo-proof figcaption {overflow-wrap:anywhere}
            .ipd-photo-proof__grid {grid-template-columns:minmax(0,1fr)}
            .actions .btn {padding:10px 8px;overflow-wrap:anywhere}
          }
          """
          class Handler(SimpleHTTPRequestHandler):
            def __init__(self,*a,**kw):super().__init__(*a,directory=str(root),**kw)
            def log_message(self,*a):pass
            def do_GET(self):
              path=urlsplit(self.path).path
              for key,html in files.items():
                if path=="/__"+key+"__/chauffeur-service/":
                  data=html.encode()
                  self.send_response(200)
                  self.send_header("Content-Type","text/html;charset=utf-8")
                  self.send_header("Content-Length",str(len(data)))
                  self.end_headers();self.wfile.write(data)
                  return
              return super().do_GET()
          server=ThreadingHTTPServer(("127.0.0.1",0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          origin="http://127.0.0.1:"+str(server.server_address[1])
          inspection="""() => {
            const cw=document.documentElement.clientWidth;
            const els=[...document.body.querySelectorAll('*')].map(el=>{
              const r=el.getBoundingClientRect();
              const style=getComputedStyle(el);
              if(r.width<=0||r.height<=0||style.visibility==='hidden'||style.display==='none')return null;
              const exceeded=Math.ceil(Math.max(0,r.right-cw,-r.left));
              return exceeded>0?{tag:el.tagName,selector:el.className && typeof el.className==='string'?el.className.slice(0,90):'',text:(el.textContent||'').trim().slice(0,58),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),over:exceeded,grid:style.gridTemplateColumns,wordBreak:style.overflowWrap}:null;
            }).filter(Boolean).sort((a,b)=>b.over-a.over).slice(0,15);
            const images=[...document.images];
            const ctas=[...document.querySelectorAll('a[href^="https://wa.me/34613756211?"]')];
            return {innerWidth:innerWidth,dpr:devicePixelRatio,clientWidth:cw,scrollWidth:document.documentElement.scrollWidth,overflow:Math.max(0,document.documentElement.scrollWidth-cw),offenders:els,ctas:ctas.map(a=>({text:a.textContent.trim(),visible:!!a.getClientRects().length,return:a.href.includes('Final%20return'),luggage:a.href.includes('Luggage')})),images:images.map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0}))}
          }"""
          results=[]
          try:
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=False,args=["--no-sandbox","--disable-background-networking","--disable-features=MediaRouter","--no-first-run"])
              for width in [375,440,768,1280]:
                for variant in ["baseline","candidate"]:
                  ctx=browser.new_context(viewport={"width":width,"height":760},device_scale_factor=1)
                  blocked=[]
                  def route(r):
                    if r.request.url.startswith(origin+"/"):r.continue_()
                    else:blocked.append(r.request.url);r.abort()
                  ctx.route("**/*",route)
                  page=ctx.new_page()
                  page.goto(origin+"/__"+variant+"__/chauffeur-service/",wait_until="load")
                  page.bring_to_front()
                  pyautogui.hotkey("ctrl","0")
                  page.wait_for_timeout(160)
                  for _ in range(5):
                    pyautogui.hotkey("ctrl","+")
                    page.wait_for_timeout(120)
                  before=page.evaluate(inspection)
                  assert abs(before["dpr"]-2)<.1 and abs(before["innerWidth"]-width/2)<2,(width,before)
                  # Force local lazy images to load; no external connections or contacts.
                  page.evaluate("() => document.querySelectorAll('img').forEach(i=>i.loading='eager')")
                  page.wait_for_timeout(120)
                  page.add_style_tag(content=css)
                  page.wait_for_timeout(160)
                  after=page.evaluate(inspection)
                  assert len(after["ctas"])==3 and all(x["visible"] for x in after["ctas"])
                  assert all(x["return"]== (variant=="candidate") and x["luggage"]==(variant=="candidate") for x in after["ctas"])
                  results.append({ "width":width, "variant":variant, "before":before, "after":after, "blockedExternal":len(blocked)})
                  ctx.close()
              browser.close()
          finally:
            server.shutdown();server.server_close()
          for x in results:
            print("REFLOW_RESULT="+json.dumps(x,ensure_ascii=False),flush=True)
          for width in [375,440,768,1280]:
            a=[x for x in results if x["width"]==width]
            assert len(a)==2
            assert a[0]["before"]["overflow"]==a[1]["before"]["overflow"]
            assert a[0]["after"]["overflow"]==a[1]["after"]["overflow"]
          failed=[(x["width"],x["variant"],x["after"]["overflow"]) for x in results if x["after"]["overflow"]>1]
          assert not failed,"CSS EXPERIMENT NEEDS FURTHER WORK "+str(failed)
          print("EXPERIMENT SUCCESS: candidate local CSS removes browser zoom horizontal overflow; NOT A DEPLOYED FIX",flush=True)
          PY
