name: Chauffeur copy QA with exact static and dynamic link invariants
on:
  push:
    branches: [qa/chauffeur-copy-local-20261104]
    paths: [.github/workflows/qa-chauffeur-copy-runtime-links-20261104.yml]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated QA dependencies
        run: python -m pip install --quiet playwright==1.56.0 beautifulsoup4 pyyaml pyobjc-framework-Quartz pyobjc-framework-Cocoa
      - name: Install browser engines
        run: python -m playwright install chromium firefox webkit
      - name: Run exact candidate QA with corrected runtime link invariant
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess, sys, yaml
          p=pathlib.Path('.github/workflows/qa-chauffeur-copy-20261104.yml')
          raw=p.read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest=='0c405c51ae0cea62648161ca1b4ec6c0f0ff3157', 'original harness changed'
          workflow=yaml.safe_load(raw)
          command=next(s['run'] for s in workflow['jobs']['browser-qa']['steps'] if s.get('name')=='Check exact copy candidate in three engines and native Safari')
          assert command.startswith("python - <<'PY'\n")
          script=command.split('\n',1)[1].rsplit('\nPY',1)[0]
          old="check(label+' canonical and anchor count unchanged',page.locator('link[rel=\"canonical\"]').get_attribute('href')=='https://ibizaprivatedrivers.com/chauffeur-service/' and page.locator('a').count()==47)"
          new="check(label+' original 47 links plus existing floating WhatsApp preserved',page.locator('link[rel=\"canonical\"]').get_attribute('href')=='https://ibizaprivatedrivers.com/chauffeur-service/' and page.eval_on_selector_all('a:not(#ipd-whatsapp-float)', '(els)=>els.map(e=>e.getAttribute(\"href\"))')==[t.get('href') for t in b.select('a')] and page.locator('a').count()==48 and page.locator('#ipd-whatsapp-float').count()==1 and page.locator('#ipd-whatsapp-float').get_attribute('href').startswith('https://wa.me/34613756211?'), {'runtime_anchors':page.locator('a').count(),'source_anchors':len(b.select('a'))})"
          assert script.count(old)==1, 'expected failed assertion not found exactly once'
          script=script.replace(old,new,1)
          compile(script,'corrected-chauffeur-browser-qa','exec')
          print('Harness correction only: original 47 source anchors must match exactly; require the additional existing analytics.js WhatsApp floating control. Candidate hash unchanged.',flush=True)
          subprocess.run([sys.executable,'-c',script],check=True)
          PY
      - name: Upload reports and screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chauffeur-copy-browser-qa-20261104
          path: /tmp/ipd-chauffeur-copy-qa-20261104/
          retention-days: 7
          if-no-files-found: warn
