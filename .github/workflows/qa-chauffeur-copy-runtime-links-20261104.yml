name: Chauffeur native Safari isolated desktop QA
on:
  push:
    branches: [qa/chauffeur-copy-local-20261104]
    paths: [.github/workflows/qa-chauffeur-copy-runtime-links-20261104.yml]
permissions:
  contents: read
jobs:
  native-safari:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native QA dependencies only
        run: python -m pip install --quiet beautifulsoup4 pyyaml pyobjc-framework-Quartz pyobjc-framework-Cocoa
      - name: Complete genuine Safari zoom on a fresh desktop without headless engines
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess, sys, yaml
          p=pathlib.Path('.github/workflows/qa-chauffeur-copy-20261104.yml')
          raw=p.read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest=='0c405c51ae0cea62648161ca1b4ec6c0f0ff3157', 'original harness changed'
          workflow=yaml.safe_load(raw)
          command=next(s['run'] for s in workflow['jobs']['browser-qa']['steps'] if s.get('name')=='Check exact copy candidate in three engines and native Safari')
          assert command.startswith("python - <<'PY'\n")
          script=command.split('\n',1)[1].rsplit('\nPY',1)[0]
          old="cross_browser();native_safari();report['result']='PASS_BROWSER_QA_ONLY_NOT_RELEASE_APPROVAL'"
          new="native_safari();report['result']='PASS_NATIVE_SAFARI_ONLY_NOT_RELEASE_APPROVAL'"
          assert script.count(old)==1
          script=script.replace(old,new,1)
          # Do not rerun the 15 completed responsive cases. No Playwright process is launched.
          # Explicit LaunchServices/AppleEvent activation replaces the failed AppKit-only foreground attempt.
          old="apps[0].activateWithOptions_(AppKit.NSApplicationActivateIgnoringOtherApps)"
          new="subprocess.run(['open','-a','Safari'],check=True,timeout=10); subprocess.run(['osascript','-e','tell application \"Safari\" to activate'],check=True,timeout=10); apps[0].activateWithOptions_(AppKit.NSApplicationActivateAllWindows | AppKit.NSApplicationActivateIgnoringOtherApps)"
          assert script.count(old)==1
          script=script.replace(old,new,1)
          old="else:raise RuntimeError('Safari is not foreground')"
          new="else:\n            subprocess.run(['screencapture','-x',str(OUT/'native-foreground-failure.png')],timeout=10)\n            front=AppKit.NSWorkspace.sharedWorkspace().frontmostApplication()\n            report['foreground_failure']={'frontmost':str(front.bundleIdentifier()) if front else None,'telemetry':dict(latest)}\n            raise RuntimeError('Safari is not foreground after explicit LaunchServices/AppleEvent activation')"
          assert script.count(old)==1
          script=script.replace(old,new,1)
          compile(script,'native-only-chauffeur-browser-qa','exec')
          print('Native-only fresh desktop, explicit Safari activation. Candidate and real zoom assertions remain unchanged. No page edits, no deployment, no system security setting changes.',flush=True)
          subprocess.run([sys.executable,'-c',script],check=True)
          PY
      - name: Upload native report and screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chauffeur-copy-native-safari-20261104
          path: /tmp/ipd-chauffeur-copy-qa-20261104/
          retention-days: 7
          if-no-files-found: warn
