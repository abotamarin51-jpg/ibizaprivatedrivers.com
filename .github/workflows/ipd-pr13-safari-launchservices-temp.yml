name: IPD PR13 native Safari synchronized keys TEMP
on:
  push:
    branches: [qa/chauffeur-quote-clarity-2026-10-24]
    paths: [.github/workflows/ipd-pr13-safari-launchservices-temp.yml]
permissions:
  contents: read
jobs:
  native-safari:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated native keyboard client
        run: python -m pip install --quiet pyobjc-framework-Quartz pyobjc-framework-Cocoa PyYAML
      - name: Acknowledged focus commands and explicit native modifier transitions
        run: |
          git fetch --quiet --depth=1 origin 5a0adc9aff6c3b72fd2d4fd52d81ac24f227a288
          python - <<'PY'
          import ast,pathlib,subprocess,yaml
          raw=subprocess.check_output(['git','show','5a0adc9aff6c3b72fd2d4fd52d81ac24f227a288:.github/workflows/ipd-pr13-safari-launchservices-temp.yml'],text=True)
          steps=yaml.safe_load(raw)['jobs']['native-safari']['steps']
          shell=next(s['run'] for s in steps if s.get('name','').startswith('LaunchServices'))
          code=shell.split("<<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
          # Retain the exact source-blob assertion, real fonts/photos, local-only CSP,
          # real 200% browser zoom assertion and all original release-blocking checks.
          # The change is in the test only: acknowledge async commands, activate the
          # actual Safari application and deliver explicit native modifier down/up.
          # Option-Tab is Apple's documented link-navigation shortcut in default Safari.
          # https://support.apple.com/en-lamr/guide/safari/cpsh003/mac
          replacements=[
            ('json.dumps(report,indent=2)','json.dumps(report,indent=2,default=str)'),
            ("json.dumps({k:report[k] for k in ['result','blob','errors','checks']},ensure_ascii=False)","json.dumps({k:report[k] for k in ['result','blob','errors','checks']},ensure_ascii=False,default=str)"),
            ("report['checks'].append({'name':name,'passed':bool(ok),'detail':data})","report['checks'].append({'name':name,'passed':bool(ok),'detail':data}); print('NATIVE_CHECK',json.dumps(report['checks'][-1],default=str),flush=True)"),
            ("command('focus',selector='details summary');key(49);d=observation('faq-open');check('Native Space opens FAQ',d['faq'][0]);key(49);d=observation('faq-closed');check('Native Space closes FAQ',not d['faq'][0])","command('focus',selector='details summary');wait_for(lambda d:d['active']['tag']=='SUMMARY');key(49);d=wait_for(lambda d:d['faq'][0]);observation('faq-open');check('Native Space opens FAQ',d['faq'][0]);key(49);d=wait_for(lambda d:not d['faq'][0]);observation('faq-closed');check('Native Space closes FAQ',not d['faq'][0])"),
            ('let clicks=[],keyEvents=[];','let clicks=[],keyEvents=[],lastCommand=null,commandFocusOK=null;'),
            ('{key:e.key,meta:e.metaKey,shift:e.shiftKey}',"{key:e.key,code:e.code,meta:e.metaKey,shift:e.shiftKey,alt:e.altKey,trusted:e.isTrusted,tag:document.activeElement?.tagName,href:document.activeElement?.getAttribute('href')}"),
            ('return {time:Date.now(),','return {time:Date.now(),ack:lastCommand,commandFocusOK,docFocus:document.hasFocus(),keyCount:keyEvents.length,'),
            ("a.focus();a.scrollIntoView({block:'center',behavior:'instant'});","a.focus();a.scrollIntoView({block:'center',behavior:'instant'});commandFocusOK=a===document.activeElement;"),
            ("await document.fonts.ready;await fetch('/__metrics'","lastCommand=cmd.id||lastCommand;await document.fonts.ready;await fetch('/__metrics'"),
            ("def command(op,**kw):commands.append({'op':op,**kw});time.sleep(.4)","""def command(op,**kw):
              ident=str(time.monotonic_ns());commands.append({'op':op,'id':ident,**kw})
              d=wait_for(lambda d:d.get('ack')==ident)
              if op=='focus':check('Focus command acknowledged on actual element',d.get('commandFocusOK'),d.get('active'))
              return d"""),
            ("def key(code,flags=0):\n    for down in (True,False):\n        event=Quartz.CGEventCreateKeyboardEvent(None,code,down);Quartz.CGEventSetFlags(event,flags);Quartz.CGEventPost(Quartz.kCGHIDEventTap,event);time.sleep(.07)\n    time.sleep(.25)","""def key(code,flags=0):
              apps=AppKit.NSRunningApplication.runningApplicationsWithBundleIdentifier_('com.apple.Safari')
              assert apps,'Safari process missing'
              apps[0].activateWithOptions_(AppKit.NSApplicationActivateIgnoringOtherApps)
              until=time.monotonic()+5
              while time.monotonic()<until:
                  front=AppKit.NSWorkspace.sharedWorkspace().frontmostApplication()
                  if front and front.bundleIdentifier()=='com.apple.Safari':break
                  time.sleep(.1)
              else:raise RuntimeError('Safari not foreground: no native key sent')
              mods=[(55,Quartz.kCGEventFlagMaskCommand),(58,Quartz.kCGEventFlagMaskAlternate),(56,Quartz.kCGEventFlagMaskShift)]
              def send(c,down,f):
                  e=Quartz.CGEventCreateKeyboardEvent(None,c,down);Quartz.CGEventSetFlags(e,f);Quartz.CGEventPost(Quartz.kCGHIDEventTap,e);time.sleep(.08)
              state=0;pressed=[]
              try:
                  for c,f in mods:
                      if flags&f:state|=f;pressed.append((c,f));send(c,True,state)
                  send(code,True,state);send(code,False,state)
              finally:
                  for c,f in reversed(pressed):state &= ~f;send(c,False,state)
              time.sleep(.45)"""),
            ("command('focus',selector='a[href^=\"https://wa.me/\"]',index=i);key(48,Quartz.kCGEventFlagMaskShift);key(48)","command('focus',selector='a[href^=\"https://wa.me/\"]',index=i);wait_for(lambda d:d['buttons'][i]['focused']);key(48,Quartz.kCGEventFlagMaskShift | Quartz.kCGEventFlagMaskAlternate);back=observation('option-shift-tab');check('Native backward key leaves current CTA',not back['buttons'][i]['focused'],back['active']);key(48,Quartz.kCGEventFlagMaskAlternate);wait_for(lambda d:d['buttons'][i]['focused'],5)"),
            ('Real Tab reaches visible quote focus','Native Option-Tab reaches visible quote focus')
          ]
          for old,new in replacements:
              assert code.count(old)==1,(code.count(old),old)
              code=code.replace(old,new)
          ast.parse(code)
          out=pathlib.Path('/tmp/ipd-safari-launchservices');out.mkdir(exist_ok=True)
          (out/'test.py').write_text(code)
          exec(compile(code,str(out/'test.py'),'exec'),{'__name__':'__main__'})
          PY
      - name: Preserve evidence without font binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-pr13-native-safari-synchronized
          path: /tmp/ipd-safari-launchservices/
          retention-days: 7
          if-no-files-found: warn
