name: IPD PR13 Native Safari LaunchServices TEMP
on:
  push:
    branches: [qa/chauffeur-quote-clarity-2026-10-24]
    paths: [.github/workflows/ipd-pr13-safari-launchservices-temp.yml]
permissions:
  contents: read
jobs:
  native-safari:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native GUI client on disposable runner only
        run: |
          python -m pip install --quiet pyobjc-framework-Quartz pyobjc-framework-Cocoa PyYAML
          defaults write com.apple.Safari WebKitTabToLinksPreferenceKey -bool true
          defaults write com.apple.Safari com.apple.Safari.ContentPageGroupIdentifier.WebKit2TabsToLinks -bool true
      - name: Reconstruct pinned Safari test with serializable reports and state-based waits
        run: |
          git fetch --quiet --depth=1 origin 5a0adc9aff6c3b72fd2d4fd52d81ac24f227a288
          python - <<'PY'
          import pathlib, subprocess, yaml
          src=subprocess.check_output(['git','show','5a0adc9aff6c3b72fd2d4fd52d81ac24f227a288:.github/workflows/ipd-pr13-safari-launchservices-temp.yml'],text=True)
          steps=yaml.safe_load(src)['jobs']['native-safari']['steps']
          shell=next(s['run'] for s in steps if s.get('name','').startswith('LaunchServices'))
          code=shell.split("<<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
          replacements=[
            ('json.dumps(report,indent=2)','json.dumps(report,indent=2,default=str)'),
            ("json.dumps({k:report[k] for k in ['result','blob','errors','checks']},ensure_ascii=False)","json.dumps({k:report[k] for k in ['result','blob','errors','checks']},ensure_ascii=False,default=str)"),
            ("report['checks'].append({'name':name,'passed':bool(ok),'detail':data})","report['checks'].append({'name':name,'passed':bool(ok),'detail':data}); print('NATIVE_CHECK',json.dumps(report['checks'][-1],default=str),flush=True)"),
            ("command('focus',selector='details summary');key(49);d=observation('faq-open');check('Native Space opens FAQ',d['faq'][0]);key(49);d=observation('faq-closed');check('Native Space closes FAQ',not d['faq'][0])","command('focus',selector='details summary');wait_for(lambda d:d['active']['tag']=='SUMMARY');key(49);d=wait_for(lambda d:d['faq'][0]);observation('faq-open');check('Native Space opens FAQ',d['faq'][0]);key(49);d=wait_for(lambda d:not d['faq'][0]);observation('faq-closed');check('Native Space closes FAQ',not d['faq'][0])")
          ]
          for old,new in replacements:
              assert code.count(old)==1,old
              code=code.replace(old,new)
          out=pathlib.Path('/tmp/ipd-safari-launchservices');out.mkdir(exist_ok=True)
          (out/'test.py').write_text(code)
          exec(compile(code,str(out/'test.py'),'exec'),{'__name__':'__main__'})
          PY
      - name: Preserve diagnostic evidence without font binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-pr13-native-safari-launchservices
          path: /tmp/ipd-safari-launchservices/
          retention-days: 7
          if-no-files-found: warn
