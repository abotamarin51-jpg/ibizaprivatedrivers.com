name: IPD PR13 public deployment verification TEMP
on:
  push:
    branches: [qa/chauffeur-quote-clarity-2026-10-24]
    paths: [.github/workflows/ipd-pr13-production-verify-temp.yml]
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae94d489dbd90194211f20417037fc38d6ad11bf
          persist-credentials: false
      - name: Verify public page against the exact merged source without executing analytics
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,time,urllib.request,urllib.parse
          from html.parser import HTMLParser
          out=pathlib.Path('/tmp/ipd-pr13-public');out.mkdir(exist_ok=True)
          root=pathlib.Path.cwd(); origin='https://ibizaprivatedrivers.com'
          report={'merge':'ae94d489dbd90194211f20417037fc38d6ad11bf','expectedHtmlBlob':'6445a3f0bb8726004d50f03f9784773fa5c8f874','checks':[],'fetches':[],'errors':[],'method':'HTTP GET only; no browser JS, analytics, contacts, forms or Maps requests'}
          def check(name,ok,detail=None):
              report['checks'].append({'name':name,'pass':bool(ok),'detail':detail})
              if not ok:raise AssertionError(name+': '+str(detail))
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def get(url):
              u=urllib.parse.urlsplit(url)
              assert u.scheme=='https' and u.hostname in ('ibizaprivatedrivers.com','fonts.googleapis.com'),url
              req=urllib.request.Request(url,headers={'User-Agent':'IPD-Release-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  check('HTTP 200 '+u.path,r.status==200,r.status)
                  check('No external redirect '+u.path,urllib.parse.urlsplit(r.url).hostname==u.hostname,r.url)
                  data=r.read(); report['fetches'].append({'url':url,'final':r.url,'status':r.status,'bytes':len(data),'blob':blob(data)});return data
          class Page(HTMLParser):
              def __init__(self):super().__init__();self.anchors=[];self.links=[];self.meta=[];self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a':self.anchors.append(a)
                  if tag=='link':self.links.append(a)
                  if tag=='meta':self.meta.append(a)
                  if tag=='img':self.images.append(a)
          try:
              expected=(root/'chauffeur-service/index.html').read_bytes()
              check('Merged HTML is approved tested blob',blob(expected)==report['expectedHtmlBlob'],blob(expected))
              page=get(origin+'/chauffeur-service/')
              for attempt in range(2):
                  if page==expected:break
                  time.sleep(15);page=get(origin+'/chauffeur-service/')
              check('Public HTML equals merged tested file byte-for-byte',page==expected,blob(page))
              (out/'public-chauffeur.html').write_bytes(page)
              p=Page();p.feed(page.decode('utf-8'))
              ctas=[a for a in p.anchors if a.get('href','').startswith('https://wa.me/')]
              check('Three quote CTAs',len(ctas)==3,len(ctas))
              payloads=[]
              for a in ctas:
                  u=urllib.parse.urlsplit(a['href']);qs=urllib.parse.parse_qs(u.query);msg=qs.get('text',[''])[0]
                  check('Original WhatsApp destination',u.hostname=='wa.me' and u.path=='/34613756211')
                  check('Quote fields retained and completed',all(msg.count(s)==1 for s in ['Date:','Start time:','Pickup:','Estimated duration:','Itinerary:','Final return:','Passengers:','Luggage:']))
                  check('Safe quote target',a.get('target')=='_blank' and 'noopener' in a.get('rel',''))
                  payloads.append(msg)
              check('Consistent quote messages',len(set(payloads))==1)
              check('Public correction present',b'id="ipd-chauffeur-reflow-candidate"' in page)
              check('Self canonical',any(a.get('rel')=='canonical' and a.get('href')==origin+'/chauffeur-service/' for a in p.links))
              check('Five language alternates',sum(a.get('rel')=='alternate' and bool(a.get('hreflang')) for a in p.links)==5)
              check('Robots indexable',any(a.get('name')=='robots' and 'index,follow' in a.get('content','') and 'noindex' not in a.get('content','') for a in p.meta))
              check('47 document links preserved',len(p.anchors)==47,len(p.anchors))
              for path in ['/assets/photo-proof.css','/assets/ivm-typography.css','/images/private-driver-ibiza-v-class-coast.webp','/images/mercedes-v-class-ibiza-marina.webp','/analytics.js']:
                  data=get(origin+path);check('Public resource equals tested source '+path,data==(root/path.lstrip('/')).read_bytes())
              font=[a['href'] for a in p.links if a.get('href','').startswith('https://fonts.googleapis.com/')]
              check('Corrected font stylesheet exists',len(font)==1 and ':wght@500;600' in font[0] and ':wght@400;500;600' in font[0])
              f=get(font[0]);check('Font CSS contains intended families',b'Cormorant Garamond' in f and b'Manrope' in f)
              for path in ['/','/services/','/blog/chauffeur-ibiza-guide-2026/','/fr/chauffeur-prive-ibiza/','/de/privatchauffeur-ibiza/','/ar/private-chauffeur-ibiza/']:
                  get(origin+path)
              report['result']='PUBLIC_DEPLOYMENT_VERIFIED'
          except Exception as e:
              report['errors'].append(str(e));report['result']='PUBLIC_VERIFICATION_FAILED'
          finally:
              (out/'report.json').write_text(json.dumps(report,indent=2));print('PUBLIC_RESULT',json.dumps(report))
          if report['errors']:raise SystemExit(1)
          PY
      - name: Preserve public read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-pr13-public-verification
          path: /tmp/ipd-pr13-public/
          retention-days: 7
          if-no-files-found: warn
