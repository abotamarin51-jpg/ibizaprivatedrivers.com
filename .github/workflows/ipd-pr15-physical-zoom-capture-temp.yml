name: IPD PR15 Physical Zoom Capture TEMP
on:
  push:
    branches:
      - qa/services-full-candidate-2026-10-30
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium, X11 screenshot utility and Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y xdotool xvfb scrot
      - name: Capture physical X11 browser window at genuine 200 percent zoom
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python - <<'PY'
          import hashlib, http.server, json, pathlib, subprocess, threading
          from PIL import Image
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          root=pathlib.Path.cwd()
          data=(root/'services/index.html').read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob=='57a11a3a50a486b95c2981d4bd65f873b82728cd',blob
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*a): pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Quiet)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          folder=pathlib.Path('qa-pr15-physical-zoom')
          folder.mkdir(exist_ok=True)
          report={'candidate_blob':blob,'method':'Headful Chromium OS Ctrl+plus; screenshot via X11 desktop, independent of Playwright screenshot','screenshots':[]}
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=False)
                  try:
                      ctx=browser.new_context(viewport={'width':640,'height':840},device_scale_factor=1)
                      def route(r):
                          u=urlparse(r.request.url)
                          if r.request.method=='GET' and u.hostname=='127.0.0.1' and u.port==server.server_port: r.continue_()
                          elif r.request.method=='GET' and u.hostname in ('fonts.googleapis.com','fonts.gstatic.com'): r.continue_()
                          else: r.abort()
                      ctx.route('**/*',route)
                      page=ctx.new_page()
                      page.add_init_script("document.addEventListener('click', e => { e.preventDefault(); e.stopImmediatePropagation(); }, true);")
                      page.goto(f'http://127.0.0.1:{server.server_port}/services/',wait_until='load',timeout=45000)
                      page.evaluate('() => document.fonts.ready')
                      page.bring_to_front()
                      subprocess.run(['xdotool','key','--clearmodifiers','ctrl+0'],check=True)
                      page.wait_for_timeout(500)
                      original=page.evaluate('devicePixelRatio')
                      ratios=[]
                      for i in range(10):
                          subprocess.run(['xdotool','key','--clearmodifiers','ctrl+plus'],check=True)
                          page.wait_for_timeout(300)
                          ratio=page.evaluate('devicePixelRatio')/original
                          ratios.append(round(ratio,3))
                          if abs(ratio-2)<.025: break
                      assert abs(ratio-2)<.025, ratios
                      report['ratios']=ratios
                      def shot(name):
                          page.wait_for_timeout(400)
                          dims=page.evaluate("""() => {
                              const d=document.documentElement, a=document.querySelector('.cta a'), b=document.querySelector('.top .book');
                              const rect=e=>{let r=e.getBoundingClientRect();return [r.left,r.right,r.top,r.bottom]};
                              return {dpr:devicePixelRatio,innerWidth,clientWidth:d.clientWidth,scrollWidth:d.scrollWidth,header:rect(b),cta:rect(a)};
                          }""")
                          subprocess.run(['scrot','-o',str(folder/(name+'-X11-fullscreen.png'))],check=True)
                          page.screenshot(path=str(folder/(name+'-playwright-viewport.png')),full_page=False)
                          x11=Image.open(folder/(name+'-X11-fullscreen.png'))
                          pwimg=Image.open(folder/(name+'-playwright-viewport.png'))
                          report['screenshots'].append({'name':name,'layout':dims,'x11_size':x11.size,'playwright_size':pwimg.size})
                          assert dims['scrollWidth']<=dims['clientWidth']+2,dims
                          assert dims['header'][0]>=-2 and dims['header'][1]<=dims['clientWidth']+2,dims
                          assert dims['cta'][0]>=-2 and dims['cta'][1]<=dims['clientWidth']+2,dims
                      page.evaluate('window.scrollTo(0,0)')
                      shot('top')
                      page.locator('.cta a').scroll_into_view_if_needed()
                      shot('cta')
                      ctx.close()
                  finally:
                      browser.close()
          finally:
              server.shutdown()
              (folder/'physical-zoom-report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print('PHYSICAL_ZOOM',json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipd-pr15-physical-zoom-evidence
          path: qa-pr15-physical-zoom/
          if-no-files-found: warn
