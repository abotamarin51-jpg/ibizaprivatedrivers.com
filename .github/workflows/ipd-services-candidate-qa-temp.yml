name: IPD Services Candidate Cross-Browser QA TEMP
on:
  push:
    branches:
      - qa/services-full-candidate-2026-10-30

permissions:
  contents: read

jobs:
  services-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browsers
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Test complete Services candidate without sending contacts or analytics
        run: |
          python - <<'PY'
          import hashlib, http.server, json, os, pathlib, re, threading
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          
          root = pathlib.Path.cwd()
          html = (root / 'services/index.html').read_bytes()
          expected_blob = '57a11a3a50a486b95c2981d4bd65f873b82728cd'
          blob = hashlib.sha1(b'blob ' + str(len(html)).encode() + b'\0' + html).hexdigest()
          assert blob == expected_blob, ('Candidate changed', blob)
          assert b'wght@500;600' in html and b'wght@400;500;600' in html
          assert html.count(b'<script') == 4
          assert b'<h2>Choose the right private transport for your Ibiza trip</h2>' in html
          
          class QuietHandler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *_): pass
          
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), QuietHandler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          port = server.server_port
          url = f'http://127.0.0.1:{port}/services/'
          outdir = pathlib.Path('qa-services-result')
          outdir.mkdir(exist_ok=True)
          report={'candidate_blob':blob,'production_modified':False,'cases':[],'failures':[],
                  'native_zoom_200':'NOT_TESTED_IN_THIS_CROSS_BROWSER_STEP'}
          
          def color_rgb(s):
              vals=[int(x) for x in re.findall(r'[\d.]+',s)[:3]]
              if len(vals)!=3: raise ValueError('Unsupported color '+str(s))
              return [n/255 for n in vals]
          
          def lum(s):
              rgb=color_rgb(s)
              lin=[v/12.92 if v<=.04045 else ((v+.055)/1.055)**2.4 for v in rgb]
              return sum(a*b for a,b in zip(lin,[.2126,.7152,.0722]))
          
          def contrast(a,b):
              a,b=sorted([lum(a),lum(b)])
              return (b+.05)/(a+.05)
          
          try:
              with sync_playwright() as pw:
                  for engine in ('chromium','firefox','webkit'):
                      browser=getattr(pw,engine).launch(headless=True)
                      try:
                          for width in (320,321,375,440,768,1280):
                              case={'engine':engine,'width':width,'checks':{},'fonts':[]}
                              report['cases'].append(case)
                              ctx=browser.new_context(viewport={'width':width,'height':900},device_scale_factor=1)
                              blocked=[]
                              def route_handler(route):
                                  parsed=urlparse(route.request.url)
                                  if parsed.hostname=='127.0.0.1' and parsed.port==port and route.request.method=='GET':
                                      route.continue_()
                                  elif parsed.hostname in ('fonts.googleapis.com','fonts.gstatic.com') and route.request.method=='GET':
                                      route.continue_()
                                  else:
                                      blocked.append(route.request.url)
                                      route.abort()
                              ctx.route('**/*', route_handler)
                              page=ctx.new_page()
                              responses=[]
                              page.on('response',lambda resp: responses.append({'url':resp.url,'status':resp.status}) if urlparse(resp.url).hostname in ('fonts.googleapis.com','fonts.gstatic.com') else None)
                              page.add_init_script("document.addEventListener('click', e => { e.preventDefault(); e.stopImmediatePropagation(); }, true);")
                              try:
                                  resp=page.goto(url,wait_until='load',timeout=30000)
                                  page.evaluate('() => document.fonts.ready')
                                  page.wait_for_timeout(300)
                                  layout=page.evaluate("""() => {
                                    const h=document.documentElement, body=document.body,
                                          cta=document.querySelector('.cta a'), eyebrow=document.querySelector('section.cluster .eyebrow');
                                    const rect= el => {const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width};};
                                    return {
                                      title:document.title, links:document.querySelectorAll('a').length,
                                      docWidth:h.scrollWidth, clientWidth:h.clientWidth,
                                      bodyWidth:body.scrollWidth, ctaRect:rect(cta), headerRect:rect(document.querySelector('.top .book')),
                                      ctaColor:getComputedStyle(cta).color, ctaBg:getComputedStyle(cta).backgroundColor,
                                      labelColor:getComputedStyle(eyebrow).color, labelBg:getComputedStyle(eyebrow.parentElement).backgroundColor,
                                      headingFont:getComputedStyle(document.querySelector('h1')).fontFamily,
                                      bodyFont:getComputedStyle(body).fontFamily,
                                      fontFaces:[...document.fonts].map(f=>({family:f.family,status:f.status,weight:f.weight})),
                                      hasTransfers:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='/ibiza-transfers/')
                                    };
                                  }""")
                                  case['layout']=layout
                                  case['fonts']=responses
                                  case['blocked_requests_count']=len(blocked)
                                  case['checks']['document_is_complete']=resp.status==200 and layout['links']==57
                                  case['checks']['font_family_css_applied']='Cormorant' in layout['headingFont'] and 'Manrope' in layout['bodyFont']
                                  face=layout['fontFaces']
                                  case['checks']['actual_font_face_loaded']=all(any(n in f['family'] and f['status']=='loaded' for f in face) for n in ('Cormorant','Manrope'))
                                  case['checks']['external_font_stylesheet_ok']=any(urlparse(x['url']).hostname=='fonts.googleapis.com' and x['status']==200 for x in responses)
                                  case['checks']['transfer_link_present']=layout['hasTransfers']
                                  case['checks']['document_horizontal_reflow']=layout['docWidth']<=layout['clientWidth']+2 and layout['bodyWidth']<=layout['clientWidth']+2
                                  case['checks']['cta_inside_viewport']=layout['ctaRect']['left']>=-2 and layout['ctaRect']['right']<=layout['clientWidth']+2
                                  case['checks']['header_button_inside_viewport']=layout['headerRect']['left']>=-2 and layout['headerRect']['right']<=layout['clientWidth']+2
                                  case['checks']['cta_color_contrast']=contrast(layout['ctaColor'],layout['ctaBg'])>=4.5
                                  # The section itself may be transparent; calculate contrast against the sand background.
                                  case['checks']['cluster_label_contrast']=contrast(layout['labelColor'],'rgb(242, 237, 228)')>=4.5
                                  page.keyboard.press('Tab')
                                  first=page.evaluate('() => ({tag:document.activeElement.tagName,href:document.activeElement.getAttribute("href"),focus:document.activeElement.matches(":focus-visible")})')
                                  page.keyboard.press('Tab')
                                  second=page.evaluate('() => document.activeElement.getAttribute("href")')
                                  page.keyboard.press('Shift+Tab')
                                  back=page.evaluate('() => document.activeElement.getAttribute("href")')
                                  case['checks']['keyboard_tab_shift_tab']=first['tag']=='A' and first['focus'] and first['href']!=second and back==first['href']
                                  if width in (320,375,1280):
                                      page.screenshot(path=str(outdir / f'{engine}-{width}.png'),full_page=True)
                                  bad=[k for k,v in case['checks'].items() if not v]
                                  if bad: report['failures'].append({'engine':engine,'width':width,'checks':bad})
                              except Exception as err:
                                  case['error']=str(err)
                                  report['failures'].append({'engine':engine,'width':width,'error':str(err)})
                              finally:
                                  ctx.close()
                      finally:
                          browser.close()
          finally:
              server.shutdown()
              (outdir / 'cross-browser-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'cases':len(report['cases']),'failures':report['failures'],'note':'Real native browser zoom is NOT tested in this job'},ensure_ascii=False))
          if report['failures']: raise SystemExit(1)
          
          PY
      - name: Store technical results (not production release evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-services-candidate-qa
          path: qa-services-result/
          if-no-files-found: warn
