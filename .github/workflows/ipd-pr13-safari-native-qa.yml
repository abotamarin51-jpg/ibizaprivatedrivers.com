name: IPD PR13 Safari Native QA Temporary
on:
  push:
    branches:
      - qa/chauffeur-quote-clarity-2026-10-24
    paths:
      - .github/workflows/ipd-pr13-safari-native-qa.yml
permissions:
  contents: read
jobs:
  native-safari:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout review branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Python WebDriver tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium and enable Safari remote automation
        run: |
          python -m pip install 'selenium>=4.25,<5'
          sudo safaridriver --enable
          safaridriver --version
      - name: Validate unchanged candidate and create local outbound-free fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, shutil, subprocess
          original = Path("chauffeur-service/index.html")
          expected = "cf1cb3a4c73c05f34390fc4c1f19b2ce371dd3c3"
          blob = subprocess.check_output(["git","hash-object",str(original)],text=True).strip()
          assert blob == expected, f"HTML candidate changed: {blob} != {expected}"
          body = original.read_text()
          out = Path(os.environ["RUNNER_TEMP"]) / "ipd_safari_qa"
          (out / "chauffeur-service").mkdir(parents=True,exist_ok=True)
          for folder in ("assets","images"):
            shutil.copytree(folder, out/folder)
          # Remove ONLY outgoing analytics and font requests in local QA copy.
          qa = re.sub(r'<script>\s*window\.dataLayer[\s\S]*?</script>','',body,count=1)
          qa = re.sub(r'<script\b[^>]*src="https://www\.googletagmanager\.com/[^"]*"[^>]*></script>','',qa)
          qa = re.sub(r'<script\b[^>]*src="/analytics\.js"[^>]*></script>','',qa)
          qa = re.sub(r'<link[^>]*href="https://fonts\.googleapis\.com/[^"]*"[^>]*>','',qa)
          assert "googletagmanager.com" not in qa and "fonts.googleapis.com" not in qa
          assert "src=\"/analytics.js\"" not in qa
          assert qa.count("https://wa.me/34613756211?text=") == 3
          (out/"chauffeur-service"/"index.html").write_text(qa)
          for f in ("assets/photo-proof.css","assets/ivm-typography.css","images/private-driver-ibiza-v-class-coast.webp","images/mercedes-v-class-ibiza-marina.webp"):
            assert (out/f).exists(),f
          print("Candidate blob verified:",blob)
          print("Native Safari fixture: actual HTML/CSS/images, analytics and external font fetch suppressed")
          PY
      - name: Start local site for Safari (no forms or external links activated)
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/ipd_safari_qa" >/tmp/ipd_safari_http.log 2>&1 &
          echo "$!" >/tmp/ipd_safari_server.pid
          sleep 3
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8765/chauffeur-service/
      - name: Native macOS Safari, keyboard, CTA, reflow and browser zoom checks
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.parse
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.common.action_chains import ActionChains
          driver = webdriver.Safari()
          driver.set_page_load_timeout(25)
          output = []
          try:
            for width in (375,440,768,1280):
              driver.set_window_rect(width=width,height=900)
              driver.get("http://127.0.0.1:8765/chauffeur-service/")
              time.sleep(0.7)
              title = driver.find_element(By.CSS_SELECTOR,"h1").text
              assert "Chauffeur Service Ibiza" in title
              links = driver.find_elements(By.CSS_SELECTOR,'a[href^="https://wa.me/34613756211?text="]')
              assert len(links)==3, len(links)
              fields = ["Date:","Start time:","Pickup:","Estimated duration:","Itinerary:","Final return:","Passengers:","Luggage:"]
              targets=[]
              for a in links:
                u = urllib.parse.urlparse(a.get_attribute("href"))
                assert u.hostname=="wa.me" and u.path=="/34613756211"
                payload=urllib.parse.parse_qs(u.query).get("text",[""])[0]
                assert all(payload.count(f)==1 for f in fields), payload
                assert a.get_attribute("target")=="_blank"
                assert "noopener" in a.get_attribute("rel")
                targets.append(payload)
              assert len(set(targets))==1
              viewport=driver.execute_script('return {width:window.innerWidth,scroll:document.documentElement.scrollWidth}')
              # Safari imposes a minimum outer window width on some runners. Record the actual CSS viewport.
              summary=driver.find_element(By.CSS_SELECTOR,"details summary")
              summary.click()
              assert driver.execute_script("return document.querySelector('details').open") is True
              for a in links:
                driver.execute_script("arguments[0].focus()",a)
                assert driver.execute_script("return document.activeElement===arguments[0]",a)
              output.append({"requested_outer_width":width,"actual_css_viewport":viewport,"links":len(links),"faq_open":True})
              print("SAFARI CHECK:",json.dumps(output[-1]))
            # Browser-native Cmd+plus, not CSS transform / document.style.zoom. Require actual CSS viewport shrink.
            driver.set_window_rect(width=768,height=900)
            driver.get("http://127.0.0.1:8765/chauffeur-service/")
            time.sleep(0.7)
            baseline=driver.execute_script("return window.innerWidth")
            readings=[baseline]
            for _ in range(10):
              ActionChains(driver).key_down(Keys.COMMAND).send_keys("+").key_up(Keys.COMMAND).perform()
              time.sleep(0.3)
              readings.append(driver.execute_script("return window.innerWidth"))
              if readings[-1] <= baseline/1.9: break
            print("SAFARI NATIVE ZOOM VIEWPORT:",json.dumps(readings))
            assert readings[-1]<=baseline/1.9, "Native Safari zoom 200% not established; do NOT publish"
            overflow=driver.execute_script("return {viewport:window.innerWidth,scroll:document.documentElement.scrollWidth}")
            print("SAFARI ZOOM 200% REFLOW:",json.dumps(overflow))
            assert overflow["scroll"] <= overflow["viewport"]+2, "200% zoom horizontal overflow"
            print("PASS: native Safari, 3 CTAs, FAQ, focus and real browser zoom at least 200%")
          finally:
            driver.quit()
          PY
      - name: Stop local QA server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ipd_safari_server.pid ]; then kill "$(cat /tmp/ipd_safari_server.pid)" || true; fi
