name: IPD PR13 complete page candidate QA
on:
  push:
    branches: [qa/chauffeur-quote-clarity-2026-10-24]
    paths: [.github/workflows/ipd-pr13-complete-page-temp.yml]
permissions:
  contents: read
jobs:
  isolated-full-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test browsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth
          python -m pip install --quiet playwright pyautogui python-xlib PyYAML
          python -m playwright install --with-deps chromium firefox webkit
      - name: Reconstruct pinned integrated test and repair only the test copy font URL
        run: |
          git fetch --quiet --depth=1 origin 48876ceae54f715268b3a6b833e70a81868f41d0
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml, py_compile
          base='48876ceae54f715268b3a6b833e70a81868f41d0'
          text=subprocess.check_output(['git','show',base+':.github/workflows/ipd-pr13-complete-page-temp.yml'],text=True)
          original=yaml.safe_load(text)['jobs']['isolated-full-page']['steps'][3]['run']
          source=original.split("<<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]+'\n'
          replacements=[
            ("patched=head.replace('</head>',style+'</head>')\nassert patched.replace(style,'')==head",
             "# Fix only the malformed font URL in the served test copy.\nfont_old='Cormorant+Garamond:wght;500;600&amp;family=Manrope:wght;400;500;600'\nfont_new='Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600'\nassert head.count(font_old)==1\npatched=head.replace(font_old,font_new).replace('</head>',style+'</head>')\nassert patched.replace(style,'').replace(font_new,font_old)==head"),
            ('results=[]; failures=[]; blocked=set(); font_requests=set()',
             'results=[]; failures=[]; blocked=set(); font_requests=set(); font_http=[]'),
            ('page=ctx.new_page();page.set_default_timeout(15000)',
             "page=ctx.new_page();page.set_default_timeout(15000)\n    page.on('response',lambda r: font_http.append({'variant':variant,'url':r.url,'status':r.status}) if urlsplit(r.url).hostname=='fonts.googleapis.com' else None)"),
            ("    assert {'Cormorant Garamond','Manrope'} <= loaded_families, ('Real fonts not loaded',m['fonts'])\n    if variant=='patched':",
             "    m['intendedFontsLoaded']={'Cormorant Garamond','Manrope'} <= loaded_families\n    # Original HEAD remains a diagnostic baseline, never an approved candidate.\n    if variant=='patched':\n        assert m['intendedFontsLoaded'], ('Real fonts not loaded',m['fonts'])"),
            ("'fontRequests':sorted(font_requests),'nativeSafari'",
             "'fontRequests':sorted(font_requests),'fontHttp':font_http,'nativeSafari'")
          ]
          for old,new in replacements:
            assert source.count(old)==1, 'Unexpected pinned test content'
            source=source.replace(old,new)
          out=Path('ipd-qa-evidence');out.mkdir(exist_ok=True)
          script=out/'reproducible-test.py';script.write_text(source)
          py_compile.compile(str(script),doraise=True)
          print('Pinned test reconstructed; site HTML and shared resources remain unmodified')
          PY
          xvfb-run -a -s "-screen 0 1800x1200x24" python ipd-qa-evidence/reproducible-test.py
      - name: Preserve reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-pr13-full-page-evidence
          path: |
            ipd-qa-evidence/*.json
            ipd-qa-evidence/*.css
            ipd-qa-evidence/*.patch
            ipd-qa-evidence/*.png
            ipd-qa-evidence/*.py
          retention-days: 7
