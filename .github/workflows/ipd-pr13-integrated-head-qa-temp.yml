name: IPD PR13 Integrated HEAD QA TEMP
on:
  push:
    branches: [qa/chauffeur-quote-clarity-2026-10-24]
    paths: [.github/workflows/ipd-pr13-integrated-head-qa-temp.yml]
permissions:
  contents: read
jobs:
  complete-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browsers and local GUI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth
          python -m pip install --quiet playwright pyautogui python-xlib
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify exact integrated PR HTML with full real assets, browser behavior and real 200 percent zoom
        run: |
          xvfb-run -a -s "-screen 0 1800x1200x24" python - <<'PY'
          import hashlib,json,re,subprocess,threading,traceback
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          import pyautogui
          root=Path.cwd(); out=root/'ipd-pr13-ci-evidence'; out.mkdir(exist_ok=True)
          path='chauffeur-service/index.html'
          raw=(root/path).read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob=='6445a3f0bb8726004d50f03f9784773fa5c8f874',blob
          source=raw.decode()
          assert source.count('id="ipd-chauffeur-reflow-candidate"')==1
          assert source.count('Final%20return%3A')==3 and source.count('Luggage%3A')==3
          assert source.count('Cormorant+Garamond:wght@500;600')==1
          assert source.index('ivm-typography.css?v=1')<source.index('id="ipd-chauffeur-reflow-candidate"')
          subprocess.run(['git','fetch','--quiet','--depth=1','origin','main'],check=True)
          main=subprocess.check_output(['git','rev-parse','FETCH_HEAD'],text=True).strip()
          assert main=='8f1a230b8339bf13535e3d4e8a01ec3fa7d1b534'
          diff=subprocess.check_output(['git','diff','--name-only','FETCH_HEAD','HEAD'],text=True).splitlines()
          assert sorted(diff)==['.github/workflows/ipd-pr13-integrated-head-qa-temp.yml',path],diff
          # Only executable analytics code is stripped from the LOCAL copy. Real HTML/CSS/images and schema remain.
          isolated=re.sub(r'<script\b(?![^>]*type="application/ld\+json")[^>]*>.*?</script>', '', source, flags=re.I|re.S)
          assert 'googletagmanager.com' not in isolated and 'src="/analytics.js"' not in isolated
          class LocalHandler(SimpleHTTPRequestHandler):
            def __init__(self,*a,**kw):super().__init__(*a,directory=str(root),**kw)
            def log_message(self,*a):pass
            def do_GET(self):
              if urlsplit(self.path).path=='/chauffeur-service/':
                b=isolated.encode()
                self.send_response(200);self.send_header('Content-Type','text/html;charset=utf-8');self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
              else:super().do_GET()
            def do_POST(self):self.send_error(405)
          server=ThreadingHTTPServer(('127.0.0.1',0),LocalHandler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          origin='http://127.0.0.1:'+str(server.server_address[1])
          attempts=[];failures=[];blocked=[];fontresponses=[]
          def route(r):
            u=urlsplit(r.request.url)
            if r.request.method=='GET' and r.request.url.startswith(origin+'/') and u.path!='/analytics.js':r.continue_();return
            if r.request.method=='GET' and u.hostname in ('fonts.googleapis.com','fonts.gstatic.com') and r.request.resource_type in ('stylesheet','font'):r.continue_();return
            blocked.append(r.request.url);r.abort()
          def load(ctx):
            page=ctx.new_page()
            page.on('response',lambda resp:fontresponses.append({'url':resp.url[:145],'status':resp.status}) if urlsplit(resp.url).hostname=='fonts.googleapis.com' else None)
            page.goto(origin+'/chauffeur-service/',wait_until='networkidle',timeout=30000)
            page.evaluate("() => document.querySelectorAll('img').forEach(i => i.loading='eager')")
            page.wait_for_function("() => [...document.images].every(i=>i.complete&&i.naturalWidth>0)",timeout=15000)
            page.evaluate("() => document.fonts.ready")
            page.wait_for_timeout(120)
            return page
          def measure(page):
            return page.evaluate("""() => ({
              width:innerWidth,dpr:devicePixelRatio,clientWidth:document.documentElement.clientWidth,
              scrollWidth:document.documentElement.scrollWidth,
              ctas:[...document.querySelectorAll('a[href^="https://wa.me/"]')].map(a=>({url:a.getAttribute('href'),height:a.getBoundingClientRect().height,visible:!!a.getClientRects().length})),
              images:[...document.images].map(i=>i.complete&&i.naturalWidth>0),
              fonts:[...document.fonts].filter(f=>f.status==='loaded').map(f=>f.family),
              faq:document.querySelectorAll('.faq details').length,
              canonical:document.querySelector('link[rel=canonical]')?.href,
              hreflang:document.querySelectorAll('link[rel=alternate][hreflang]').length,
              anchors:document.querySelectorAll('a').length,
              stylePresent:!!document.getElementById('ipd-chauffeur-reflow-candidate')
            })""")
          def check(page,engine,width,zoom):
            m=measure(page)
            assert m['scrollWidth']<=m['clientWidth']+1,('overflow',m['clientWidth'],m['scrollWidth'])
            assert m['stylePresent'] and m['canonical']=='https://ibizaprivatedrivers.com/chauffeur-service/'
            assert m['hreflang']==5 and m['anchors']==47 and m['faq']==7
            assert len(m['images'])==2 and all(m['images'])
            assert len(m['ctas'])==3 and all(a['height']>=43.99 and a['visible'] for a in m['ctas'])
            for a in m['ctas']:
              assert a['url'].startswith('https://wa.me/34613756211?text=')
              assert 'Final return:' in unquote(a['url']) and 'Luggage:' in unquote(a['url'])
            families={x.strip('"') for x in m['fonts']}
            assert {'Cormorant Garamond','Manrope'}<=families,('fonts',families)
            if zoom==100:
              sums=page.locator('.faq summary')
              for s in sums.all():
                s.focus();s.press('Enter');assert s.evaluate('(e)=>e.parentElement.open')
                s.press('Space');assert not s.evaluate('(e)=>e.parentElement.open')
              page.locator('a.brand').focus()
              seen=set()
              for i in range(80):
                page.keyboard.press('Tab')
                f=page.evaluate("""() => {
                  const e=document.activeElement,r=e.getBoundingClientRect(),s=getComputedStyle(e);
                  return {btn:e.classList.contains('btn'),href:e.getAttribute('href'),key:[...document.querySelectorAll('.btn')].indexOf(e),
                    focusVisible:e.matches(':focus-visible'),outline:s.outlineStyle,outlineWidth:parseFloat(s.outlineWidth),height:r.height}
                }""")
                if f['btn']:
                  assert f['focusVisible'] and f['outline']!='none' and f['outlineWidth']>=3 and f['height']>=43.99,('focus',f)
                  seen.add(f['key'])
                if len(seen)>=4:break
              assert len(seen)==4,('keyboard focus target count',seen)
              page.keyboard.press('Shift+Tab')
              assert page.evaluate("() => document.activeElement.tagName!='BODY'")
            attempts.append({'engine':engine,'width':width,'zoom':zoom,'viewport':m['clientWidth'],'scroll':m['scrollWidth'],'fonts':m['fonts'],'images':m['images'],'ctas':len(m['ctas'])})
            print('QA_PASS',engine,width,zoom,m['clientWidth'],m['scrollWidth'],flush=True)
          try:
            with sync_playwright() as p:
              for engine in ('chromium','firefox','webkit'):
                browser=getattr(p,engine).launch(headless=(engine!='chromium'),args=['--no-sandbox'] if engine=='chromium' else [])
                try:
                  for width in (187,220,320,375,440,768,1280):
                    ctx=browser.new_context(viewport={'width':width,'height':820},ignore_https_errors=True,service_workers='block')
                    ctx.route('**/*',route)
                    try:
                      page=load(ctx);check(page,engine,width,100)
                      if width in (187,375):
                        page.screenshot(path=str(out/f'{engine}-{width}.png'),full_page=True)
                    except Exception as exc:
                      failures.append({'engine':engine,'width':width,'zoom':100,'error':str(exc)})
                    finally:ctx.close()
                  if engine=='chromium':
                    for width in (375,440,768,1280):
                      ctx=browser.new_context(viewport={'width':width,'height':820},ignore_https_errors=True,service_workers='block')
                      ctx.route('**/*',route)
                      try:
                        page=load(ctx);page.bring_to_front()
                        pyautogui.hotkey('ctrl','0');page.wait_for_timeout(200)
                        before=measure(page)
                        for i in range(5):
                          pyautogui.hotkey('ctrl','+');page.wait_for_timeout(140)
                        after=measure(page)
                        assert abs(after['dpr']/before['dpr']-2)<.05 and abs(after['width']-before['width']/2)<2,('zoom not real',before['width'],after['width'],before['dpr'],after['dpr'])
                        check(page,engine,width,200)
                      except Exception as exc:failures.append({'engine':engine,'width':width,'zoom':200,'error':str(exc)})
                      finally:ctx.close()
                finally:browser.close()
          finally:
            server.shutdown()
            report={'htmlBlob':blob,'main':main,'attempts':attempts,'failures':failures,'blocked':blocked[:30],'fontResponses':fontresponses[:20],
                    'nativeSafari':'NOT TESTED','production':'UNCHANGED'}
            (out/'report.json').write_text(json.dumps(report,indent=2))
            print('QA_SUMMARY',json.dumps({'passed':len(attempts),'failures':failures,'fontsHttp':fontresponses[:4]}),flush=True)
          assert not failures,failures
          PY
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-pr13-exact-integrated-head
          path: ipd-pr13-ci-evidence/
          retention-days: 7
          if-no-files-found: warn
