name: One-time global structured data repair

on:
  push:
    paths:
      - '.github/workflows/one-time-global-schema-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair owned Organization and LocalBusiness entities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          SITE = 'https://ibizaprivatedrivers.com/'
          LOGO = SITE + 'images/logo.png'
          ADDRESS = {
              '@type': 'PostalAddress',
              'streetAddress': 'Avenida Ignacio Wallis 394',
              'addressLocality': 'Ibiza',
              'addressRegion': 'Balearic Islands',
              'postalCode': '07800',
              'addressCountry': 'ES',
          }
          script_re = re.compile(r'(<script\s+type=["\']application/ld\+json["\']>)(.*?)(</script>)', re.I | re.S)
          modified_files = []

          def types_of(node):
              t = node.get('@type')
              if isinstance(t, str): return {t}
              if isinstance(t, list): return {x for x in t if isinstance(x, str)}
              return set()

          def is_owned(node):
              name = str(node.get('name', ''))
              ident = str(node.get('@id', ''))
              url = str(node.get('url', ''))
              return name == 'Ibiza Private Drivers' or ident.startswith(SITE) or url == SITE

          def repair(node):
              changed = False
              if isinstance(node, dict):
                  ts = types_of(node)
                  if 'Organization' in ts and is_owned(node) and 'logo' not in node:
                      node['logo'] = {'@type': 'ImageObject', 'url': LOGO}
                      changed = True
                  if 'LocalBusiness' in ts and is_owned(node) and 'address' not in node:
                      node['address'] = dict(ADDRESS)
                      changed = True
                  for value in list(node.values()):
                      if repair(value): changed = True
              elif isinstance(node, list):
                  for value in node:
                      if repair(value): changed = True
              return changed

          for p in sorted(Path('.').rglob('*.html')):
              if '.git' in p.parts:
                  continue
              original = p.read_text(encoding='utf-8')
              file_changed = False

              def repl(match):
                  nonlocal_holder = None
                  global file_changed
                  raw = match.group(2).strip()
                  try:
                      data = json.loads(raw)
                  except Exception:
                      return match.group(0)
                  if not repair(data):
                      return match.group(0)
                  file_changed = True
                  encoded = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
                  return match.group(1) + encoded + match.group(3)

              updated = script_re.sub(repl, original)
              if file_changed and updated != original:
                  p.write_text(updated, encoding='utf-8')
                  modified_files.append(p.as_posix())

          if not modified_files:
              print('No structured-data repairs needed.')
          else:
              print(f'Repaired {len(modified_files)} HTML files')

          # Update sitemap lastmod only for pages genuinely changed today.
          def path_to_url(path):
              if path == 'index.html': return SITE
              if path.endswith('/index.html'):
                  return SITE + path[:-10]
              return SITE + path

          changed_urls = {path_to_url(path) for path in modified_files}
          for sitemap_name in ('sitemap.xml', 'sitemap-priority.xml'):
              sp = Path(sitemap_name)
              if not sp.exists(): continue
              text = sp.read_text(encoding='utf-8')
              for url in changed_urls:
                  pattern = rf'(<loc>{re.escape(url)}</loc><lastmod>)[^<]+(</lastmod>)'
                  text = re.sub(pattern, rf'\g<1>2026-09-17\g<2>', text, count=1)
              sp.write_text(text, encoding='utf-8')
          PY

      - name: Commit schema repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' sitemap.xml sitemap-priority.xml
          git commit -m 'Repair owned Organization and LocalBusiness schema sitewide'
          git push
