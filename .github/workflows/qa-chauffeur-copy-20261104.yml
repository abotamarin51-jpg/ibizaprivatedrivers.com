name: Chauffeur copy candidate isolated browser QA
on:
  push:
    branches: [qa/chauffeur-copy-local-20261104]
    paths: [.github/workflows/qa-chauffeur-copy-20261104.yml]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated QA dependencies
        run: python -m pip install --quiet playwright==1.56.0 beautifulsoup4 pyobjc-framework-Quartz pyobjc-framework-Cocoa
      - name: Install browser engines
        run: python -m playwright install chromium firefox webkit
      - name: Check exact copy candidate in three engines and native Safari
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, subprocess, threading, time, traceback, urllib.request
          from pathlib import Path
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          ROOT = Path.cwd()
          OUT = Path('/tmp/ipd-chauffeur-copy-qa-20261104'); OUT.mkdir(exist_ok=True)
          SOURCE_BLOB = '6445a3f0bb8726004d50f03f9784773fa5c8f874'
          CANDIDATE_BLOB = '19f347343f0b246c88ad227757ddf18d4d5b971b'
          old = 'A point-to-point transfer is designed for one confirmed pickup and destination. A chauffeur booking is more suitable when the schedule includes several movements, waiting time or a vehicle that remains connected to the itinerary for an agreed period.'
          new = 'Looking for a private car service in Ibiza? Choose a point-to-point transfer for one confirmed pickup and destination, or a chauffeur booking for several stops and agreed waiting time. Share your itinerary so the driver, vehicle and schedule can be confirmed before booking.'
          repeat = 'The requested duration does not automatically define unlimited travel or unlisted stops. '
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          raw = (ROOT/'chauffeur-service/index.html').read_bytes()
          assert blob(raw)==SOURCE_BLOB, 'baseline differs: stop'
          source = raw.decode('utf-8')
          assert source.count(old)==1 and source.count(repeat)==1
          candidate = source.replace(old, new, 1).replace(repeat, '', 1)
          assert blob(candidate.encode())==CANDIDATE_BLOB, 'candidate differs: stop'
          a,b = BeautifulSoup(source,'html.parser'), BeautifulSoup(candidate,'html.parser')
          assert [(x.name,x.attrs) for x in a.find_all(True)]==[(x.name,x.attrs) for x in b.find_all(True)]
          assert [str(x) for x in a.select('a,script,style,link,meta,title,h1,h2,h3,.faq')]==[str(x) for x in b.select('a,script,style,link,meta,title,h1,h2,h3,.faq')]
          assert len(b.select('a'))==47 and len(b.select('.faq details'))==7
          report={'source_blob':SOURCE_BLOB,'candidate_blob':CANDIDATE_BLOB,'candidate_sha256':hashlib.sha256(candidate.encode()).hexdigest(),'checks':[],'errors':[],'published':False,'scope':'isolated full-page candidate with local real resources and tracking/contact interception; no release approval','instrumentation':'font URL served from cache, remote Google tag removed, preconnect removed, local consent denied and contacts blocked; source bytes checked before instrumentation','matrix':[]}
          def check(name, passed, detail=None):
              report['checks'].append({'name':name,'passed':bool(passed),'detail':detail})
              print(('PASS ' if passed else 'FAIL ')+name+' '+str(detail)[:180],flush=True)
              if not passed: raise AssertionError(name+': '+str(detail)[:300])
          assets={}
          match=re.search(r'https://fonts.googleapis.com/css2[^\"]+',candidate)
          assert match and 'wght@' in match.group()
          font_url=html.unescape(match.group())
          def getfont(url):
              assert urlsplit(url).hostname in ('fonts.googleapis.com','fonts.gstatic.com')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Macintosh; Intel Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Safari/605.1.15'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  assert r.status==200
                  return r.read()
          css=getfont(font_url).decode()
          assert '@font-face' in css
          for i,u in enumerate(dict.fromkeys(re.findall(r'url\((https://fonts.gstatic.com/[^)]+)\)',css))):
              p='/__font/'+str(i)+'.woff2'; assets[p]=(getfont(u),'font/woff2'); css=css.replace(u,p)
          assets['/__fonts.css']=(css.encode(),'text/css')
          doc=candidate.replace(match.group(),'/__fonts.css')
          doc=re.sub(r'<script\b[^>]*src="https://www\.googletagmanager\.com/[^\"]+"[^>]*></script>','',doc,flags=re.I)
          doc=re.sub(r'<link\b[^>]*rel="preconnect"[^>]*>','',doc,flags=re.I)
          safety='''<script>localStorage.setItem('ipd_google_consent_v1','denied');document.addEventListener('click',function(e){let a=e.target.closest('a');if(a){e.preventDefault();e.stopImmediatePropagation();}},true);document.addEventListener('submit',function(e){e.preventDefault();e.stopImmediatePropagation();},true);</script>'''
          doc=doc.replace('<head>','<head>'+safety,1)
          telemetry=r'''<script>
          let ack='',errors=[];window.addEventListener('error',e=>errors.push(String(e.message)));
          function metrics(){let a=document.querySelector('.hero .actions a[href^="https://wa.me/"]'),r=a?.getBoundingClientRect(),hit=r?document.elementFromPoint(Math.max(1,Math.min(innerWidth-2,r.left+r.width/2)),Math.max(1,Math.min(innerHeight-2,r.top+r.height/2))):null;let copy=document.querySelector('main>section .lead'),cr=copy.getBoundingClientRect();return {ack,ua:navigator.userAgent,iw:innerWidth,ih:innerHeight,dpr:devicePixelRatio,client:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth,fonts:[...document.fonts].filter(f=>f.status==='loaded').map(f=>f.family),h1:document.querySelector('h1').textContent.trim(),copy:copy.textContent.trim(),copyRect:{left:cr.left,right:cr.right,top:cr.top,bottom:cr.bottom},photos:[...document.images].map(i=>i.complete&&i.naturalWidth>0),faq:document.querySelectorAll('.faq details[open]').length,cta:{focused:a===document.activeElement,hit:!!a&&!!hit&&(hit===a||a.contains(hit)),visible:!!r&&r.top>=0&&r.bottom<=innerHeight},external:performance.getEntriesByType('resource').filter(x=>!x.name.startsWith(location.origin)).map(x=>x.name),errors};}
          async function poll(){try{let c=await fetch('/__command').then(r=>r.json());if(c.op==='focus'){let a=document.querySelector('.hero .actions a[href^="https://wa.me/"]');a.scrollIntoView({block:'center',behavior:'instant'});a.focus();}if(c.op==='copy')document.querySelector('main>section .lead').scrollIntoView({block:'center',behavior:'instant'});if(c.op==='faq')document.querySelector('.faq summary').click();if(c.op==='photo0'||c.op==='photo1')document.images[c.op==='photo0'?0:1].scrollIntoView({block:'center',behavior:'instant'});ack=c.id||ack;await document.fonts.ready;await fetch('/__metrics',{method:'POST',body:JSON.stringify(metrics())});}catch(e){errors.push(String(e));}setTimeout(poll,150);}poll();
          </script>'''
          doc=doc.replace('</body>',telemetry+'</body>')
          policy="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'"
          queue=[];latest={};server_errors=[]
          class Handler(SimpleHTTPRequestHandler):
              def __init__(self,*a,**kw):super().__init__(*a,directory=str(ROOT),**kw)
              def log_message(self,*a):pass
              def end_headers(self):
                  self.send_header('Content-Security-Policy',policy);self.send_header('Cache-Control','no-store');super().end_headers()
              def send(self,data,mime):
                  self.send_response(200);self.send_header('Content-Type',mime);self.send_header('Content-Length',str(len(data)));self.end_headers();self.wfile.write(data)
              def do_GET(self):
                  p=urlsplit(self.path).path
                  if p=='/chauffeur-service/':return self.send(doc.encode(),'text/html; charset=utf-8')
                  if p=='/__command':return self.send(json.dumps(queue.pop(0) if queue else {}).encode(),'application/json')
                  if p in assets:return self.send(*assets[p])
                  if p=='/analytics.js' or p=='/favicon.ico' or p.startswith(('/assets/','/images/')):return super().do_GET()
                  self.send_error(404)
              def do_POST(self):
                  if self.path!='/__metrics':return self.send_error(405)
                  d=json.loads(self.rfile.read(int(self.headers.get('Content-Length','0'))));latest.clear();latest.update(d);return self.send(b'{}','application/json')
          server=ThreadingHTTPServer(('127.0.0.1',0),Handler);threading.Thread(target=server.serve_forever,daemon=True).start()
          origin='http://127.0.0.1:'+str(server.server_port);url=origin+'/chauffeur-service/'
          def cross_browser():
              from playwright.sync_api import sync_playwright
              with sync_playwright() as p:
                  for engine in ('chromium','firefox','webkit'):
                      browser=getattr(p,engine).launch()
                      report.setdefault('versions',{})[engine]=browser.version
                      for width in (320,375,440,768,1280):
                          label=f'{engine}-{width}';errors=[];blocked=[]
                          ctx=browser.new_context(viewport={'width':width,'height':900},service_workers='block')
                          def route(r):
                              if urlsplit(r.request.url).netloc==urlsplit(origin).netloc:r.continue_()
                              else:blocked.append(r.request.url);r.abort()
                          ctx.route('**/*',route);page=ctx.new_page();page.on('pageerror',lambda e:errors.append(str(e)))
                          try:
                              page.goto(url,wait_until='domcontentloaded');page.evaluate('document.fonts.ready')
                              check(label+' exact proposed copy',page.locator('main>section .lead').first.inner_text()==new)
                              d=page.evaluate('metrics()')
                              check(label+' real fonts loaded',any('Cormorant' in f for f in d['fonts']) and any('Manrope' in f for f in d['fonts']),d['fonts'])
                              check(label+' no horizontal overflow',d['scroll']<=d['client']+1,[d['scroll'],d['client']])
                              for idx in range(2):
                                  img=page.locator('.ipd-photo-proof img').nth(idx);img.scroll_into_view_if_needed();page.wait_for_function('(i)=>{let e=document.querySelectorAll(".ipd-photo-proof img")[i];return e.complete&&e.naturalWidth>0;}',arg=idx)
                              check(label+' both real vehicle images loaded',page.evaluate('[...document.images].every(i=>i.complete&&i.naturalWidth>0)'))
                              for idx in range(7):
                                  detail=page.locator('.faq details').nth(idx);summary=detail.locator('summary');summary.scroll_into_view_if_needed();summary.focus();page.keyboard.press('Enter');check(label+f' FAQ {idx+1} opens by keyboard',detail.evaluate('(e)=>e.open'));page.keyboard.press('Enter')
                              for idx in range(3):
                                  cta=page.locator('a[href^="https://wa.me/"]').nth(idx);cta.evaluate('(e)=>{e.scrollIntoView({block:"center",behavior:"instant"});e.focus();}')
                                  page.keyboard.press('Tab');page.keyboard.press('Shift+Tab');cta.evaluate('(e)=>e.scrollIntoView({block:"center",behavior:"instant"})')
                                  state=cta.evaluate('(e)=>{let r=e.getBoundingClientRect(),s=getComputedStyle(e),x=r.left+r.width/2,y=r.top+r.height/2,h=document.elementFromPoint(x,y);return {focused:document.activeElement===e,hit:!!h&&(h===e||e.contains(h)),visible:r.width>0&&r.height>0&&y>0&&y<innerHeight,outline:s.outlineStyle!=="none"&&parseFloat(s.outlineWidth)>0};}')
                                  check(label+f' CTA {idx+1} keyboard focus visible',all(state.values()),state)
                              copy=page.locator('main>section .lead').first;copy.evaluate('(e)=>e.scrollIntoView({block:"center",behavior:"instant"})')
                              check(label+' new text inside viewport width',copy.evaluate('(e)=>{let r=e.getBoundingClientRect();return r.left>=0&&r.right<=document.documentElement.clientWidth+1;}'))
                              if width in (375,1280):page.screenshot(path=str(OUT/(label+'-copy.png')),full_page=True)
                              check(label+' no page errors',not errors,errors)
                              check(label+' no attempted offsite requests',not blocked,blocked)
                              check(label+' canonical and anchor count unchanged',page.locator('link[rel="canonical"]').get_attribute('href')=='https://ibizaprivatedrivers.com/chauffeur-service/' and page.locator('a').count()==47)
                              report['matrix'].append({'browser':engine,'width':width,'result':'PASS'})
                          except Exception:
                              page.screenshot(path=str(OUT/(label+'-failure.png')),full_page=True);raise
                          finally:ctx.close()
                      browser.close()
          def native_safari():
              import AppKit, Quartz
              latest.clear();queue.clear()
              def wait_for(pred,seconds=30):
                  until=time.monotonic()+seconds
                  while time.monotonic()<until:
                      if latest and pred(latest):return dict(latest)
                      time.sleep(.12)
                  raise TimeoutError('Native Safari telemetry missing: '+str(latest)[:300])
              def command(op):
                  ident=str(time.monotonic_ns());queue.append({'op':op,'id':ident});return wait_for(lambda x:x.get('ack')==ident)
              def key(code,flags=0):
                  apps=AppKit.NSRunningApplication.runningApplicationsWithBundleIdentifier_('com.apple.Safari');assert apps
                  apps[0].activateWithOptions_(AppKit.NSApplicationActivateIgnoringOtherApps)
                  deadline=time.monotonic()+5
                  while time.monotonic()<deadline:
                      front=AppKit.NSWorkspace.sharedWorkspace().frontmostApplication()
                      if front and front.bundleIdentifier()=='com.apple.Safari':break
                      time.sleep(.1)
                  else:raise RuntimeError('Safari is not foreground')
                  def emit(c,down,f):
                      e=Quartz.CGEventCreateKeyboardEvent(None,c,down);Quartz.CGEventSetFlags(e,f);Quartz.CGEventPost(Quartz.kCGHIDEventTap,e);time.sleep(.07)
                  held=[];current=0
                  try:
                      for c,f in [(55,Quartz.kCGEventFlagMaskCommand),(58,Quartz.kCGEventFlagMaskAlternate),(56,Quartz.kCGEventFlagMaskShift)]:
                          if flags&f:current|=f;held.append((c,f));emit(c,True,current)
                      emit(code,True,current);emit(code,False,current)
                  finally:
                      for c,f in reversed(held):current&=~f;emit(c,False,current)
                  time.sleep(.4)
              def capture(name):
                  wins=[dict(x) for x in Quartz.CGWindowListCopyWindowInfo(Quartz.kCGWindowListOptionOnScreenOnly,Quartz.kCGNullWindowID) if x.get('kCGWindowOwnerName')=='Safari' and x.get('kCGWindowLayer')==0 and x.get('kCGWindowBounds',{}).get('Width',0)>300]
                  if wins:subprocess.run(['screencapture','-x','-l',str(wins[0]['kCGWindowNumber']),str(OUT/(name+'.png'))],check=True,timeout=10)
              check('native Safari keyboard access',bool(Quartz.CGPreflightPostEventAccess()))
              subprocess.run(['open','-a','Safari',url],check=True,timeout=12)
              d=wait_for(lambda x:'Safari/' in x.get('ua','') and x.get('copy')==new,45)
              check('native Safari exact candidate copy',d['copy']==new)
              check('native Safari real fonts loaded',any('Cormorant' in f for f in d['fonts']) and any('Manrope' in f for f in d['fonts']),d['fonts'])
              for i in range(2):command('photo'+str(i));wait_for(lambda x:x.get('photos',[False,False])[i],20)
              check('native Safari both real photos loaded',all(latest['photos']))
              d=command('faq');check('native Safari FAQ opens',d['faq']>=1)
              key(29,Quartz.kCGEventFlagMaskCommand)
              base=command('focus');check('native Safari 100% CTA visible and focused',all(base['cta'].values()),base['cta'])
              check('native Safari 100% no overflow',base['scroll']<=base['client']+1)
              command('copy');capture('safari-copy-100pct')
              for _ in range(8):
                  key(24,Quartz.kCGEventFlagMaskCommand);zoom=command('focus')
                  if base['iw']/zoom['iw']>=1.98:break
              ratio=base['iw']/zoom['iw'];check('native Safari genuine 200% page zoom',1.98<=ratio<=2.04 and zoom['dpr']/base['dpr']>=1.98,{'ratio':ratio,'before_width':base['iw'],'after_width':zoom['iw'],'before_dpr':base['dpr'],'after_dpr':zoom['dpr']})
              check('native Safari 200% no overflow',zoom['scroll']<=zoom['client']+1,[zoom['client'],zoom['scroll']])
              check('native Safari 200% booking CTA visible and focused',all(zoom['cta'].values()),zoom['cta'])
              d=command('copy');check('native Safari 200% proposed text fits',d['copy']==new and d['copyRect']['left']>=0 and d['copyRect']['right']<=d['client']+1,d['copyRect']);capture('safari-copy-200pct')
              check('native Safari no offsite resources',not d['external'],d['external']);check('native Safari no script errors',not d['errors'],d['errors'])
              report['native_safari']={'result':'PASS','telemetry_100':base,'telemetry_200':d,'zoom_ratio':ratio}
          try:
              check('source and exact candidate verified',True,{'source':SOURCE_BLOB,'candidate':CANDIDATE_BLOB})
              cross_browser();native_safari();report['result']='PASS_BROWSER_QA_ONLY_NOT_RELEASE_APPROVAL'
          except Exception as e:
              report['errors'].append(str(e));report['traceback']=traceback.format_exc();report['result']='INCOMPLETE_OR_FAILED'
          finally:
              report['passed']=sum(x['passed'] for x in report['checks']);report['total']=len(report['checks'])
              (OUT/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              server.shutdown()
              print('QA_RESULT',json.dumps({k:report[k] for k in ('result','candidate_blob','passed','total','errors')}),flush=True)
          if report['errors']:raise SystemExit(1)
          PY
      - name: Upload reports and screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chauffeur-copy-browser-qa-20261104
          path: /tmp/ipd-chauffeur-copy-qa-20261104/
          retention-days: 7
          if-no-files-found: warn
