name: German airport fonts and page-local reflow QA - no deployment
on:
  push:
    branches: [qa/de-airport-font-20261104]
    paths: [.github/workflows/qa-de-airport-font-20261104.yml]
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: macos-26-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --quiet playwright==1.56.0 beautifulsoup4 pyyaml pyobjc-framework-Quartz pyobjc-framework-Cocoa
      - name: Install browser engines
        run: python -m playwright install chromium firefox webkit
      - name: Test changed candidate and correct intentionally hidden-control assumptions
        run: |
          python - <<'PY'
          import hashlib, subprocess, sys, yaml
          raw=subprocess.check_output(['git','show','c148561142b2e8422d6a955ef0a27bc863a4764a:.github/workflows/qa-de-airport-font-20261104.yml'])
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest=='e12bb452ac106c2d8500bceb25ea2356445077a8','Original harness changed'
          data=yaml.safe_load(raw)
          command=next(s['run'] for s in data['jobs']['isolated-qa']['steps'] if s.get('name')=='Verify exact font-only candidate without production requests')
          script=command.split('\n',1)[1].rsplit('\nPY',1)[0]
          def replace(old,new):
              global script
              assert script.count(old)==1,(old[:100],script.count(old))
              script=script.replace(old,new,1)
          css='\n<style id="ipd-de-airport-reflow">\n/* Page-local: keep long German headings within the available width. */\n.hero-inner{min-width:0;width:100%;max-width:900px}\n.hero h1,.section h2{overflow-wrap:anywhere;hyphens:auto}\n</style>\n'
          replace('candidate=source.replace(old,new,1);','page_css='+repr(css)+'; candidate=source.replace(old,new,1).replace("</head>",page_css+"</head>",1);')
          replace('assert candidate.replace(new,old,1)==source and sum(x!=y for x,y in zip(source,candidate))==2','assert candidate.replace(page_css,"",1).replace(new,old,1)==source and source.count("</head>")==1')
          replace("[str(t) for t in b.select('script,meta,title,style')]","[str(t) for t in b.select('script,meta,title,style:not(#ipd-de-airport-reflow)')]")
          replace("'changed_characters':2","'font_url_characters_changed':2,'page_local_reflow_css_added':True")
          replace('Only two font URL separator characters changed; body and scripts preserved','Font URL plus two page-local reflow rules; body and scripts preserved')
          replace("Path('/tmp/ipd-de-airport-font-20261104')","Path('/tmp/ipd-de-airport-font-reflow-20261104')")
          replace("OUT/'font-only.patch'","OUT/'font-and-reflow.patch'")
          lines=script.splitlines(); changed=0; output=[]
          for line in lines:
              if 'c=page.locator(' in line and 'nth(i);c.evaluate(' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  locator=line.strip().split(';c.evaluate(',1)[0]
                  output.extend([indent+locator,
                      indent+'if not c.is_visible():',
                      indent+'    report.setdefault("intentionally_hidden_controls",[]).append({"case":label,"text":c.inner_text(),"selector":".navcta","reason":"Unchanged shared CSS hides the duplicate navigation CTA below 900px; hero CTA remains tested"})',
                      indent+'    continue',
                      indent+'''c.evaluate('e=>{e.focus({preventScroll:true});e.scrollIntoView({block:"center",behavior:"instant"});}')''',
                      indent+'page.wait_for_timeout(400)',
                      indent+'''c.evaluate('e=>e.scrollIntoView({block:"center",behavior:"instant"})')'''])
                  changed+=1
              else:output.append(line)
          assert changed==1
          script='\n'.join(output)+'\n'
          replace('inside:r.left>=0&&r.right<=innerWidth&&r.top>=0&&r.bottom<=innerHeight','inside:r.left>=-1&&r.right<=innerWidth+1&&r.top>=-1&&r.bottom<=innerHeight+1')
          compile(script,'de-airport-reflow-qa','exec')
          print('New local candidate: original font repair plus two page-scoped CSS rules. Rerun justified by changed candidate. Navigation CTA intentionally hidden in original mobile CSS is recorded, not treated as a broken booking path. No page or shared CSS edits in repository.',flush=True)
          subprocess.run([sys.executable,'-c',script],check=True)
          PY
      - name: Upload evidence only - no font files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-airport-font-reflow-qa-20261104
          path: /tmp/ipd-de-airport-font-reflow-20261104/
          retention-days: 14
          if-no-files-found: warn
