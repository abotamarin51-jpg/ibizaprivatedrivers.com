name: German airport unchanged candidate - split isolated QA
on:
  push:
    branches: [qa/de-airport-font-20261104]
    paths: [.github/workflows/qa-de-airport-font-20261104.yml]
permissions:
  contents: read
jobs:
  isolated-qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: browsers
            os: ubuntu-24.04
          - mode: native
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      QA_MODE: ${{ matrix.mode }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_DEFAULT_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install common binary dependencies with bounded retries
        timeout-minutes: 2
        run: |
          python -m pip install --only-binary=:all: --retries 1 beautifulsoup4==4.13.4 PyYAML==6.0.2
      - name: Install only browser dependencies
        if: matrix.mode == 'browsers'
        timeout-minutes: 4
        run: |
          python -m pip install --only-binary=:all: --retries 1 playwright==1.56.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Install only native macOS binary dependencies
        if: matrix.mode == 'native'
        timeout-minutes: 2
        run: |
          python -m pip install --only-binary=:all: --retries 1 pyobjc-core==12.2.2 pyobjc-framework-Cocoa==12.2.2 pyobjc-framework-Quartz==12.2.2
      - name: Validate same exact candidate with independent engine groups
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, yaml
          mode=os.environ['QA_MODE']; assert mode in ('browsers','native')
          path='.github/workflows/qa-de-airport-font-20261104.yml'
          raw=subprocess.check_output(['git','show','0b9e967f9af1ca1baed8eb28488754ffcf09c284:'+path])
          digest=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert digest=='b6190d71ef2103be5f9f4261c6974d0bdd55243b','V2 harness changed'
          data=yaml.safe_load(raw)
          command=next(s['run'] for s in data['jobs']['isolated-qa']['steps'] if s.get('name')=='Test changed candidate and correct intentionally hidden-control assumptions')
          wrapper=command.split('\n',1)[1].rsplit('\nPY',1)[0]
          call="subprocess.run([sys.executable,'-c',script],check=True)"
          assert wrapper.count(call)==1
          ns={};exec(compile(wrapper.replace(call,'pass',1),'verified-v2-wrapper','exec'),ns)
          script=ns['script']
          needle="report={'baseline_blob':"
          assert script.count(needle)==1
          script=script.replace(needle,"assert blob(candidate.encode())=='6bc3ad90c57fc1d6fd737a3d6910978da48a1b7e','Exact V2 candidate changed'\n"+needle,1)
          native_start=script.index('    # Native Safari first,')
          browser_start=script.index('    from playwright.sync_api import sync_playwright')
          browser_end=script.index("\nexcept Exception as e:report['errors'].append(str(e));report['traceback']=traceback.format_exc()",browser_start)
          if mode=='browsers':
              script=script[:native_start]+script[browser_start:]
              gate="len(report['matrix'])==15"
          else:
              script=script[:browser_start]+script[browser_end:]
              gate="'native_safari' in report"
          original_gate="len(report['matrix'])==15 and 'native_safari' in report"
          assert script.count(original_gate)==1
          script=script.replace(original_gate,gate,1)
          needle="report['passed']=sum(c['passed'] for c in report['checks']);"
          assert script.count(needle)==1
          script=script.replace(needle,"report['engine_group']="+repr(mode)+";"+needle,1)
          compile(script,'de-airport-split-qa','exec')
          print('Exact unchanged V2. Split engine group:',mode,'No release approval or repository page changes.',flush=True)
          subprocess.run([sys.executable,'-c',script],check=True)
          PY
      - name: Upload reports and screenshots only - no font files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-airport-v2-${{ matrix.mode }}-20261104
          path: /tmp/ipd-de-airport-font-reflow-20261104/
          retention-days: 14
          if-no-files-found: warn
