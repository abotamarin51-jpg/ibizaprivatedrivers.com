name: German airport V3 - complete scoped tests and native zoom
on:
  push:
    branches: [qa/de-airport-font-20261104]
    paths: [.github/workflows/qa-de-airport-mobile-title-v3-20261104.yml]
permissions:
  contents: read
jobs:
  isolated-qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: browsers
            os: ubuntu-24.04
          - mode: native
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      QA_MODE: ${{ matrix.mode }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_DEFAULT_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Common binary dependencies
        timeout-minutes: 2
        run: |
          python -m pip install --only-binary=:all: --retries 1 beautifulsoup4==4.13.4 PyYAML==6.0.2
      - name: Missing desktop engine only
        if: matrix.mode == 'browsers'
        timeout-minutes: 4
        run: |
          python -m pip install --only-binary=:all: --retries 1 playwright==1.56.0
          python -m playwright install --with-deps firefox
      - name: Native Safari binary dependencies
        if: matrix.mode == 'native'
        timeout-minutes: 2
        run: |
          python -m pip install --only-binary=:all: --retries 1 pyobjc-core==12.2.2 pyobjc-framework-Cocoa==12.2.2 pyobjc-framework-Quartz==12.2.2
      - name: Recover exact harness without altering nested call literal
        timeout-minutes: 4
        run: |
          python - <<'PY'
          import hashlib, subprocess, yaml
          path='.github/workflows/qa-de-airport-mobile-title-v3-20261104.yml'
          raw=subprocess.check_output(['git','show','a19cd0de0bb0dc814d4b2e714549e06985735948:'+path])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='8299510dd165d90c727c676208e0843aa816d295'
          data=yaml.safe_load(raw)
          command=next(s['run'] for s in data['jobs']['isolated-qa']['steps'] if s.get('name')=='Complete missing exact V3 checks with corrected scope and native method')
          wrapper=command.split('\n',1)[1].rsplit('\nPY',1)[0]
          old='assert wrapper.count(call)==1'
          assert wrapper.count(old)==1
          wrapper=wrapper.replace(old,'assert wrapper.count(call)==2',1)
          old="wrapper.replace(call,'pass',1)"
          assert wrapper.count(old)==1
          wrapper=wrapper.replace(old,"'pass'.join(wrapper.rsplit(call,1))",1)
          print('Correct recovery of nested harness: preserve its inner call literal and replace only the final execution. Candidate and page checks unchanged.',flush=True)
          exec(compile(wrapper,'verified-scoped-v3-followup','exec'),{})
          PY
      - name: Evidence only - no font files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-airport-v3-final-${{ matrix.mode }}-20261104
          path: /tmp/ipd-de-airport-v3-20261104/
          retention-days: 14
          if-no-files-found: warn
