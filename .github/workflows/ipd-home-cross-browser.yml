name: IPD PR10 browser QA - NO DEPLOY

on:
  push:
    branches:
      - fix/home-mobile-nav-focus-inert-2026-10-06
    paths:
      - index.html
      - assets/**
      - images/**
      - analytics.js
      - qa/pr10/**
      - .github/workflows/ipd-home-cross-browser.yml

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          python -m pip install -r qa/pr10/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
          npm install --prefix "$RUNNER_TEMP/ipd-qa-deps" --ignore-scripts --no-audit --no-fund axe-core@4.14.0
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool

      - name: Complete Home QA in Chromium Firefox and WebKit
        run: |
          python qa/pr10/run_home_qa.py             --root .             --output "$RUNNER_TEMP/ipd-pr10-qa/full"             --browser chromium             --browser firefox             --browser webkit             --axe "$RUNNER_TEMP/ipd-qa-deps/node_modules/axe-core/axe.min.js"

      - name: Chromium native UI zoom 200 percent
        if: always()
        run: |
          xvfb-run -a python qa/pr10/run_home_qa.py             --root .             --output "$RUNNER_TEMP/ipd-pr10-qa/native-zoom"             --browser chromium             --native-zoom             --axe "$RUNNER_TEMP/ipd-qa-deps/node_modules/axe-core/axe.min.js"
