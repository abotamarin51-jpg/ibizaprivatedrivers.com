name: IPD PR10 Browser QA
on:
  push:
    branches:
      - fix/home-mobile-nav-focus-inert-2026-10-06

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: python -m pip install -r qa/pr10/requirements.txt

      - name: Install Chromium Firefox and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run complete local browser QA
        run: |
          mkdir -p /tmp/ipd-pr10-qa
          python qa/pr10/run_home_qa.py \
            --root . \
            --output /tmp/ipd-pr10-qa/full \
            --browser chromium \
            --browser firefox \
            --browser webkit
