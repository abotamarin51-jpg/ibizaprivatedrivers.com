name: IPD PR10 browser QA - NO DEPLOY
on:
  push:
    branches:
      - fix/home-mobile-nav-focus-inert-2026-10-06
    paths:
      - index.html
      - assets/**
      - images/**
      - analytics.js
      - qa/pr10/**
      - .github/workflows/ipd-home-cross-browser.yml
permissions:
  contents: read
concurrency:
  group: ipd-pr10-browser-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  complete-resource-browser-qa:
    if: github.repository == 'abotamarin51-jpg/ibizaprivatedrivers.com' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QA_OUTPUT: ${{ runner.temp }}/ipd-pr10-qa
      QA_DEPS: ${{ runner.temp }}/ipd-qa-deps
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies on the runner only
        run: |
          python -m pip install -r qa/pr10/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
          npm install --prefix "$QA_DEPS" --ignore-scripts --no-audit --no-fund axe-core@4.14.0
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
      - name: Check complete Home in Chromium, Firefox and WebKit
        id: full
        run: >-
          python qa/pr10/run_home_qa.py --root . --output "$QA_OUTPUT/full"
          --browser chromium --browser firefox --browser webkit
          --axe "$QA_DEPS/node_modules/axe-core/axe.min.js"
      - name: Native Chromium UI zoom 200 percent - not viewport emulation
        if: ${{ !cancelled() }}
        run: >-
          xvfb-run -a python qa/pr10/run_home_qa.py --root . --output "$QA_OUTPUT/native-zoom"
          --browser chromium --native-zoom
          --axe "$QA_DEPS/node_modules/axe-core/axe.min.js"
      - name: Summarise without publishing, approving or merging
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['QA_OUTPUT'])
          summary=['# IPD PR10 - automated QA only','No deployment. No merge. Manual review remains mandatory.']
          for p in root.glob('*/report.json'):
              r=json.loads(p.read_text()); failed=[x for x in r['checks'] if not x['passed']]
              summary += [f"## {p.parent.name}: {r['status']}",f"Checks: {len(r['checks'])}; failed: {len(failed)}",f"Candidate SHA256: `{r['candidate_sha256']}`"]
              summary += [f"- {x['name']}: {str(x.get('detail',''))[:600]}" for x in failed]
              summary += [f"- Setup/runtime error: {x[:600]}" for x in r['errors']]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('\n'.join(summary)+'\n')
          PY
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && vars.IPD_QA_UPLOAD_ARTIFACTS == 'true' }}
        with:
          name: ipd-pr10-qa-${{ github.sha }}
          path: ${{ runner.temp }}/ipd-pr10-qa/
          retention-days: 1
          if-no-files-found: warn
