name: One-time SEO schema cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-seo-schema-fix.yml'

permissions:
  contents: write

jobs:
  fix-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix venue and hotel structured data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'private-driver-dc10-ibiza/index.html',
              'private-driver-nobu-hotel-ibiza/index.html',
              'private-driver-ibiza-gran-hotel/index.html',
              'private-driver-destino-five-ibiza/index.html',
              'private-driver-standard-ibiza/index.html',
              'private-driver-blue-marlin-ibiza/index.html',
              'private-driver-six-senses-ibiza/index.html',
              'private-driver-7pines-resort-ibiza/index.html',
          ]

          old_provider = '"provider":{"@type":"LocalBusiness","@id":"https://ibizaprivatedrivers.com/#business","name":"Ibiza Private Drivers","url":"https://ibizaprivatedrivers.com/","telephone":"+34613756211","hasMap":"https://maps.app.goo.gl/YUyHpxYTWAqaFgUeA?g_st=ic"}'
          new_provider = '"provider":{"@type":"LocalBusiness","@id":"https://ibizaprivatedrivers.com/#business","name":"Ibiza Private Drivers","url":"https://ibizaprivatedrivers.com/","telephone":"+34613756211","hasMap":"https://maps.app.goo.gl/YUyHpxYTWAqaFgUeA?g_st=ic","address":{"@type":"PostalAddress","streetAddress":"Avenida Ignacio Wallis 394","addressLocality":"Ibiza","addressRegion":"Balearic Islands","postalCode":"07800","addressCountry":"ES"}}'

          for filename in files:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if old_provider not in text:
                  raise SystemExit(f'Expected LocalBusiness provider pattern not found in {filename}')
              text = text.replace(old_provider, new_provider, 1)
              text = text.replace('"dateModified":"2026-09-01"', '"dateModified":"2026-09-17"', 1)
              p.write_text(text, encoding='utf-8')

          # Keep sitemap lastmod truthful for the pages changed by this workflow.
          sitemap = Path('sitemap.xml')
          text = sitemap.read_text(encoding='utf-8')
          urls = [
              'private-driver-dc10-ibiza/',
              'private-driver-nobu-hotel-ibiza/',
              'private-driver-ibiza-gran-hotel/',
              'private-driver-destino-five-ibiza/',
              'private-driver-standard-ibiza/',
              'private-driver-blue-marlin-ibiza/',
              'private-driver-six-senses-ibiza/',
              'private-driver-7pines-resort-ibiza/',
              'private-driver-unvrs-ibiza/',
              'private-driver-amnesia-ibiza/',
          ]
          for path in urls:
              prefix = f'<url><loc>https://ibizaprivatedrivers.com/{path}</loc><lastmod>'
              start = text.find(prefix)
              if start < 0:
                  raise SystemExit(f'Sitemap URL not found: {path}')
              value_start = start + len(prefix)
              value_end = text.find('</lastmod>', value_start)
              text = text[:value_start] + '2026-09-17' + text[value_end:]
          sitemap.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add private-driver-*/index.html sitemap.xml
          git commit -m 'Fix structured data across venue and hotel pages'
          git push
