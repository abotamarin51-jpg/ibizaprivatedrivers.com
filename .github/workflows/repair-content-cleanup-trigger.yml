name: Repair content cleanup trigger

on:
  push:
    paths:
      - '.github/workflows/repair-content-cleanup-trigger.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix failed workflow path and update conductor page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          wf = Path('.github/workflows/one-time-content-quality-cleanup.yml')
          text = wf.read_text(encoding='utf-8')
          text = re.sub(r"^\s*'conductor-privado-ibiza/index\.html':.*\n", '', text, flags=re.M)
          text = text.replace("for path in ('conductor-privado-ibiza/index.html', 'blog/index.html'):", "for path in ('blog/index.html',):")
          wf.write_text(text, encoding='utf-8')

          md = Path('conductor-privado-ibiza.md')
          body = md.read_text(encoding='utf-8')
          body, n1 = re.subn(r'^title:\s*"[^"]*"', 'title: "Conductor Privado Ibiza | Chófer y Traslados"', body, count=1, flags=re.M)
          body, n2 = re.subn(r'^description:\s*"[^"]*"', 'description: "Reserva conductor privado en Ibiza para aeropuerto, hoteles, villas, marinas y vida nocturna, con servicio de chófer en Mercedes-Benz V-Class."', body, count=1, flags=re.M)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not update conductor front matter')
          md.write_text(body, encoding='utf-8')

          sm = Path('sitemap.xml')
          s = sm.read_text(encoding='utf-8')
          s, n = re.subn(r'(<loc>https://ibizaprivatedrivers\.com/conductor-privado-ibiza/</loc><lastmod>)[^<]+(</lastmod>)', r'\g<1>2026-09-17\g<2>', s, count=1)
          if n != 1:
              raise SystemExit('Could not update conductor sitemap lastmod')
          sm.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-content-quality-cleanup.yml conductor-privado-ibiza.md sitemap.xml
          git commit -m 'Repair content cleanup workflow and Spanish driver metadata'
          git push
