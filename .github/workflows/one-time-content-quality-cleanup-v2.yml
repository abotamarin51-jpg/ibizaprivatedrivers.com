name: One-time content quality cleanup v2

on:
  push:
    paths:
      - '.github/workflows/one-time-content-quality-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve metadata and multilingual route depth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          SITE = 'https://ibizaprivatedrivers.com/'
          changed = set()
          skipped = []

          metadata = {
            'luxury-transfers/index.html': ('Luxury Transfers Ibiza | Premium Private Driver', 'Pre-book premium private transfers in Ibiza for airports, hotels, villas, marinas and nightlife, with Mercedes-Benz V-Class chauffeur service.'),
            'villa-transfers/index.html': (None, 'Pre-book private villa transfers in Ibiza with exact map-pin pickup, airport connections and Mercedes-Benz V-Class chauffeur service.'),
            'vip-driver-ibiza/index.html': (None, 'Private VIP driver service in Ibiza for hotels, villas, events, marinas and nightlife, with pre-booked Mercedes-Benz V-Class transport.'),
            'yacht-transfers/index.html': (None, 'Pre-book yacht and marina transfers in Ibiza for ports, hotels, villas and Ibiza Airport, with private Mercedes-Benz V-Class chauffeur transport.'),
            'travel-advisors-concierge-ibiza/index.html': ('Ibiza Chauffeur Partner | Travel Advisors & Concierge', None),
            'multi-day-chauffeur-ibiza/index.html': (None, 'Book a multi-day chauffeur in Ibiza for consecutive service days, hotels, villas, marinas, restaurants and nightlife with one coordinated itinerary.'),
            'fr/transfert-aeroport-ibiza/index.html': (None, 'Réservez un transfert privé depuis l’aéroport d’Ibiza (IBZ) vers hôtels, villas et marinas, avec chauffeur et Mercedes-Benz Classe V.'),
            'luxury-hotel-transfers-ibiza/index.html': ('Luxury Hotel Transfers Ibiza | Private Driver', 'Pre-book private hotel transfers in Ibiza for airport arrivals, villas, marinas and nightlife, with Mercedes-Benz V-Class chauffeur transport.'),
            'fr/transfert-aeroport-ibiza-santa-eulalia/index.html': ('Transfert aéroport Ibiza–Santa Eulalia | Chauffeur', 'Réservez un transfert privé entre l’aéroport d’Ibiza et Santa Eulalia pour hôtels, villas ou marina, avec chauffeur et prise en charge confirmée.'),
            'fr/transfert-aeroport-ibiza-san-antonio/index.html': (None, 'Réservez un transfert privé entre l’aéroport d’Ibiza et San Antonio pour hôtels ou villas, avec chauffeur et prise en charge confirmée à l’avance.'),
            'de/flughafentransfer-ibiza-stadt/index.html': (None, 'Privater Flughafentransfer von Ibiza nach Ibiza-Stadt für Hotels, Villen oder Marina, mit Chauffeur und vorab bestätigter Abholung.'),
            'de/flughafentransfer-ibiza-san-antonio/index.html': (None, 'Privater Flughafentransfer von Ibiza nach San Antonio für Hotels oder Villen, mit Chauffeur und vorab bestätigter Abholung.'),
            'de/flughafentransfer-ibiza-santa-eulalia/index.html': (None, 'Privater Flughafentransfer von Ibiza nach Santa Eulalia für Hotels, Villen oder Marina, mit Chauffeur und bestätigter Abholung.'),
            'fr/transfert-aeroport-ibiza-playa-den-bossa/index.html': ('Transfert aéroport Ibiza–Playa d’en Bossa | Chauffeur', None),
            'de/flughafentransfer-ibiza-playa-den-bossa/index.html': ('Flughafentransfer Ibiza–Playa d’en Bossa | Fahrer', None),
            'ibiza-airport-to-playa-den-bossa/index.html': (None, 'Pre-book a private transfer from Ibiza Airport to Playa d’en Bossa for hotels or apartments, with flight-aware pickup and Mercedes-Benz V-Class service.'),
            'fr/transfert-aeroport-ibiza-ville/index.html': (None, 'Réservez un transfert privé entre l’aéroport d’Ibiza et Ibiza-ville pour hôtels, appartements ou marina, avec chauffeur et prise en charge confirmée.'),
            'private-driver-playa-den-bossa-ibiza/index.html': ("Private Driver Playa d'en Bossa | Chauffeur Ibiza", 'Pre-book a private driver in Playa d’en Bossa for hotels, Ibiza Airport, restaurants and nightlife, with Mercedes-Benz V-Class chauffeur service.'),
            'private-driver-talamanca-ibiza/index.html': (None, 'Pre-book a private driver in Talamanca for hotels, Marina Botafoch, Ibiza Airport, restaurants and nightlife, with Mercedes-Benz V-Class service.'),
            'private-driver-es-cubells-ibiza/index.html': (None, 'Pre-book a private driver in Es Cubells for villas, Ibiza Airport, restaurants and island itineraries, with Mercedes-Benz V-Class chauffeur service.'),
            'fr/transfert-aeroport-ibiza-formentera/index.html': ('Aéroport Ibiza–Formentera | Transfert privé au port', None),
            'de/flughafentransfer-ibiza-formentera/index.html': ('Flughafen Ibiza–Formentera | Privater Transfer zum Hafen', None),
            'fr/chauffeur-prive-ibiza/index.html': (None, 'Réservez un chauffeur privé à Ibiza à l’heure, à la journée ou sur plusieurs jours pour hôtels, villas, marinas et itinéraires sur mesure.'),
            'fr/guides/chauffeur-prive-ibiza-france-suisse-monaco-2026/index.html': ('Chauffeur privé Ibiza | France, Suisse & Monaco 2026', 'Guide 2026 pour réserver un chauffeur privé à Ibiza depuis la France, la Suisse ou Monaco: transferts, journées avec chauffeur et itinéraires.'),
            'blog/chauffeur-ibiza-guide-2026/index.html': ('Chauffeur Ibiza Guide 2026 | Hourly & Full-Day Driver', None),
            'blog/ibiza-airport-transfer-guide-2026/index.html': (None, 'Ibiza Airport transfer guide for 2026 covering private pickup planning, hotels, villas, marinas, luggage, flight details and onward journeys.'),
            'blog/private-driver-ibiza-usa-uk-travel-guide-2026/index.html': (None, '2026 guide for USA and UK travellers booking a private driver in Ibiza for airport transfers, hotels, villas, marinas, nightlife and multi-day plans.'),
          }

          def replace_meta(path, title, description):
              p = Path(path)
              if not p.exists():
                  skipped.append(f'missing metadata file: {path}')
                  return
              text = p.read_text(encoding='utf-8')
              original = text
              if title:
                  text, n = re.subn(r'<title>[^<]*</title>', f'<title>{title}</title>', text, count=1, flags=re.I)
                  if n == 0:
                      skipped.append(f'no title tag: {path}')
                  text = re.sub(r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{title}">', text, count=1, flags=re.I)
              if description:
                  text, n = re.subn(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{description}">', text, count=1, flags=re.I)
                  if n == 0:
                      skipped.append(f'no meta description: {path}')
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.add(path)

          for path, values in metadata.items():
              replace_meta(path, *values)

          localized_sections = {
            'fr/transfert-aeroport-ibiza-san-antonio/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Bien préparer votre transfert vers San Antonio</h2><p>Pour une prise en charge fluide, indiquez le numéro de vol, le nombre de passagers, les bagages et l’adresse exacte de votre hôtel, villa ou appartement à San Antonio. Si votre hébergement possède plusieurs entrées, envoyez le nom de l’établissement et, si possible, un lien de localisation ou les instructions d’accès. Ces informations permettent de préparer le point de dépose avant l’arrivée plutôt que de le chercher une fois sur place.</p><p>Vous pouvez également demander le trajet retour vers l’aéroport ou intégrer ce transfert à un programme plus large avec restaurants, plages ou sorties nocturnes. Les horaires restent à confirmer selon votre réservation et les conditions de circulation du jour. Pour toute modification de vol ou d’adresse, transmettez la mise à jour dès que possible afin que le service puisse être reconfirmé.</p></div></section>''',
            'fr/transfert-aeroport-ibiza-santa-eulalia/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Organiser l’arrivée à Santa Eulalia</h2><p>Avant l’arrivée à Ibiza, envoyez votre numéro de vol, le nombre de passagers, les bagages et la destination exacte à Santa Eulalia. Le service peut être préparé pour un hôtel, une villa, un appartement ou un point de rendez-vous confirmé près de la marina. Pour une propriété privée, un lien de localisation et les éventuelles instructions d’accès évitent les recherches de dernière minute.</p><p>Le transfert peut être réservé uniquement à l’arrivée ou combiné avec un retour vers l’aéroport et d’autres déplacements pendant le séjour. Les temps de route peuvent varier selon la circulation et l’emplacement exact; aucune durée fixe n’est donc promise. En cas de changement de vol, de nombre de passagers ou de destination, envoyez les nouvelles informations afin que la prise en charge puisse être reconfirmée.</p></div></section>''',
            'fr/transfert-aeroport-ibiza-playa-den-bossa/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Arrivée à Playa d’en Bossa avec chauffeur privé</h2><p>Pour préparer le transfert, communiquez le numéro de vol, le nombre de passagers, les bagages et le nom exact de l’hôtel ou de l’hébergement à Playa d’en Bossa. Lorsque plusieurs entrées ou zones de dépose existent, une adresse précise ou un lien de localisation aide à définir le bon point avant l’arrivée. Le chauffeur suit les informations confirmées pour la réservation.</p><p>Si votre séjour comprend restaurants, clubs, plages ou un retour tardif, vous pouvez demander séparément un service de chauffeur ou des trajets supplémentaires. La circulation varie fortement selon l’heure et les événements; les temps de parcours ne sont donc pas garantis. Toute modification de vol, d’hébergement ou de nombre de passagers doit être communiquée afin que le service puisse être adapté et reconfirmé.</p></div></section>''',
            'de/flughafentransfer-ibiza-stadt/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Abholung für Ibiza-Stadt richtig planen</h2><p>Für die Vorbereitung benötigen wir Flugnummer, Passagierzahl, Gepäck und die genaue Zieladresse in Ibiza-Stadt. Bei Hotels, Apartments oder privaten Unterkünften mit mehreren Eingängen hilft ein Kartenlink oder eine kurze Zugangsinformation. So kann der Zielpunkt vor der Ankunft festgelegt werden, anstatt ihn erst während der Fahrt zu klären.</p><p>Der Transfer kann als einzelne Flughafenfahrt gebucht oder mit Rückfahrt, Restaurant-, Marina- oder Abendfahrten kombiniert werden. Fahrzeiten hängen von Verkehr, Uhrzeit und dem genauen Ziel ab und werden deshalb nicht als feste Dauer zugesagt. Ändern sich Flug, Passagierzahl oder Unterkunft, senden Sie die neuen Angaben möglichst früh, damit die Abholung erneut bestätigt werden kann.</p></div></section>''',
            'de/flughafentransfer-ibiza-san-antonio/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Flughafentransfer nach San Antonio vorbereiten</h2><p>Senden Sie vor der Ankunft die Flugnummer, Passagierzahl, Gepäckmenge und die genaue Adresse Ihres Hotels, Apartments oder Ihrer Villa in San Antonio. Bei privaten Unterkünften sind ein Kartenlink und Hinweise zum Eingang besonders hilfreich. Dadurch lässt sich der Ziel- und Treffpunkt klar planen, bevor das Fahrzeug am Flughafen bereitsteht.</p><p>Auf Wunsch kann zusätzlich eine Rückfahrt zum Flughafen oder ein Chauffeurservice für weitere Wege auf Ibiza angefragt werden. Verkehr und Zufahrten können sich je nach Tageszeit ändern, daher wird keine feste Fahrdauer garantiert. Flugänderungen, zusätzliche Passagiere oder eine neue Zieladresse sollten früh mitgeteilt werden, damit der gebuchte Service entsprechend geprüft und bestätigt werden kann.</p></div></section>''',
            'de/flughafentransfer-ibiza-santa-eulalia/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Ankunft in Santa Eulalia mit privatem Fahrer</h2><p>Für einen gut vorbereiteten Transfer teilen Sie Flugnummer, Passagierzahl, Gepäck und das genaue Ziel in Santa Eulalia mit. Das kann ein Hotel, eine Villa, ein Apartment oder ein bestätigter Treffpunkt an der Marina sein. Bei privaten Häusern helfen ein Kartenlink, Torhinweise und eine erreichbare Kontaktperson, damit die Anfahrt eindeutig geplant werden kann.</p><p>Die Fahrt kann einzeln oder zusammen mit Rücktransfer und weiteren Chauffeurfahrten während des Aufenthalts gebucht werden. Die tatsächliche Fahrzeit hängt von Verkehr und Zieladresse ab. Wenn sich Flugzeiten, Gepäck, Passagierzahl oder Unterkunft ändern, sollten die neuen Angaben möglichst früh übermittelt werden, damit Fahrzeug und Abholung erneut bestätigt werden können.</p></div></section>''',
            'de/flughafentransfer-ibiza-playa-den-bossa/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Transfer nach Playa d’en Bossa planen</h2><p>Für die Abholung am Flughafen benötigen wir Flugnummer, Passagierzahl, Gepäck und den genauen Namen des Hotels oder der Unterkunft in Playa d’en Bossa. Bei mehreren Eingängen oder Zufahrten ist ein Kartenlink hilfreich, damit der richtige Absetzpunkt im Voraus festgelegt werden kann. Die Buchung wird anhand der bestätigten Angaben vorbereitet.</p><p>Weitere Fahrten zu Restaurants, Clubs, Stränden oder zurück zum Flughafen können separat angefragt werden. Je nach Uhrzeit und Veranstaltung kann sich die Verkehrslage deutlich verändern, deshalb wird keine feste Fahrdauer versprochen. Bitte teilen Sie Flugänderungen, eine andere Unterkunft oder zusätzliche Passagiere frühzeitig mit, damit die Planung geprüft und der Service erneut bestätigt werden kann.</p></div></section>''',
            'ar/airport-transfer-ibiza-town/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>تنظيم الوصول من المطار إلى مدينة إيبيزا</h2><p>لترتيب الاستقبال بشكل واضح، أرسل رقم الرحلة وعدد الركاب وكمية الأمتعة واسم الفندق أو عنوان السكن بدقة في مدينة إيبيزا. إذا كان للمكان أكثر من مدخل أو كانت هناك تعليمات خاصة للوصول، فمن المفيد إرسال رابط الموقع أو نقطة الالتقاء المناسبة مسبقاً. بهذه الطريقة يمكن تجهيز تفاصيل الرحلة قبل الوصول.</p><p>يمكن حجز النقل كرحلة واحدة من المطار، أو إضافة رحلة عودة وخدمات سائق خاصة لزيارات المطاعم والمارينا ومناطق أخرى في الجزيرة. مدة الطريق تعتمد على حركة المرور والموقع النهائي، لذلك لا يتم ضمان وقت ثابت. عند تغيير الرحلة أو السكن أو عدد الركاب، يرجى إرسال التفاصيل الجديدة لإعادة تأكيد الخدمة.</p></div></section>''',
            'ar/airport-transfer-ibiza-san-antonio/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>الاستعداد للنقل من مطار إيبيزا إلى سان أنطونيو</h2><p>قبل الوصول، أرسل رقم الرحلة وعدد الركاب والأمتعة والعنوان الدقيق للفندق أو الفيلا أو الشقة في سان أنطونيو. بالنسبة للمنازل الخاصة، يساعد رابط الموقع وتعليمات البوابة أو المدخل في تحديد وجهة الوصول بدقة. يتم تنظيم الحجز وفق المعلومات المؤكدة التي ترسلها قبل الرحلة.</p><p>يمكن أيضاً طلب رحلة عودة إلى المطار أو خدمة سائق خاصة لتحركات أخرى خلال الإقامة. حركة المرور قد تتغير حسب الساعة والموسم والفعاليات، لذلك لا يتم تحديد مدة ثابتة للطريق. إذا تغير موعد الرحلة أو عدد الركاب أو مكان الإقامة، أرسل التحديثات في أقرب وقت حتى يمكن مراجعة التخطيط وإعادة تأكيد السيارة.</p></div></section>''',
            'ar/airport-transfer-ibiza-santa-eulalia/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>تنظيم الوصول إلى سانتا إيولاليا</h2><p>لخدمة نقل مرتبة، أرسل رقم الرحلة وعدد الركاب والأمتعة والوجهة الدقيقة في سانتا إيولاليا. يمكن أن تكون الوجهة فندقاً أو فيلا أو شقة أو نقطة لقاء مؤكدة قرب المارينا. عند التوجه إلى منزل خاص، يفضل إرسال رابط الموقع وتعليمات الدخول ورقم شخص يمكن التواصل معه عند الحاجة.</p><p>يمكن حجز الرحلة من المطار فقط أو إضافة رحلة عودة وخدمات سائق أخرى أثناء الإقامة في إيبيزا. زمن الطريق يتغير حسب حركة المرور والعنوان النهائي ولا يتم ضمان مدة ثابتة. أي تعديل في الرحلة أو الأمتعة أو عدد الركاب أو مكان الإقامة يجب إرساله مبكراً حتى يمكن تحديث الحجز وإعادة تأكيد تفاصيل الاستقبال.</p></div></section>''',
            'ar/airport-transfer-ibiza-playa-den-bossa/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>النقل من المطار إلى بلايا دين بوسا</h2><p>أرسل رقم الرحلة وعدد الركاب والأمتعة واسم الفندق أو عنوان السكن الدقيق في بلايا دين بوسا. إذا كان للفندق أكثر من مدخل أو توجد منطقة محددة لإنزال الركاب، يساعد رابط الموقع في تحديد النقطة الصحيحة قبل الوصول. يتم تجهيز الخدمة على أساس البيانات المؤكدة في الحجز.</p><p>يمكن طلب رحلات إضافية إلى المطاعم أو النوادي أو الشواطئ أو العودة إلى المطار بشكل منفصل. حركة المرور في المنطقة قد تختلف حسب الوقت والفعاليات، ولذلك لا يتم ضمان مدة ثابتة للرحلة. عند حدوث تغيير في موعد الطائرة أو مكان الإقامة أو عدد الركاب، يرجى إرسال المعلومات الجديدة مبكراً لمراجعة التخطيط وإعادة تأكيد الخدمة.</p></div></section>''',
            'fr/transfert-aeroport-ibiza-formentera/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Coordonner l’aéroport d’Ibiza avec votre ferry pour Formentera</h2><p>Ce service concerne le transport routier privé entre l’aéroport d’Ibiza et le port ou terminal confirmé pour votre ferry. Envoyez le numéro de vol, l’heure prévue d’arrivée, le nombre de passagers, les bagages et les informations de votre traversée. Les billets de ferry ne sont pas inclus dans le transfert routier et doivent être organisés séparément.</p><p>Les horaires de vol, la circulation et les opérations maritimes peuvent évoluer; il est donc important de prévoir une marge adaptée plutôt que de considérer une correspondance comme garantie. Si votre vol est retardé ou si votre ferry change, transmettez la mise à jour dès que possible. Pour le retour, indiquez l’heure d’arrivée prévue du ferry à Ibiza et votre vol de départ afin que le trajet vers l’aéroport puisse être planifié et confirmé séparément.</p></div></section>''',
            'de/flughafentransfer-ibiza-formentera/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Flughafen Ibiza und Formentera-Fähre koordinieren</h2><p>Dieser Service umfasst den privaten Straßentransfer vom Flughafen Ibiza zum bestätigten Hafen oder Fährterminal. Senden Sie Flugnummer, geplante Ankunft, Passagierzahl, Gepäck und die vorhandenen Fährdaten. Fährtickets gehören nicht zum Straßentransfer und müssen separat gebucht werden.</p><p>Flugzeiten, Verkehr und Fährbetrieb können sich ändern. Deshalb sollte für die Verbindung ein sinnvoller Zeitpuffer eingeplant werden; eine bestimmte Fähre kann durch den Fahrservice nicht garantiert werden. Bei Flugverspätung oder Fahrplanänderung teilen Sie die neuen Daten möglichst früh mit. Für die Rückreise können Sie die geplante Ankunft der Fähre auf Ibiza und den Abflug angeben, damit der Transfer vom Hafen zum Flughafen separat geplant und bestätigt werden kann.</p></div></section>''',
            'ar/airport-transfer-ibiza-formentera/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>تنسيق الوصول إلى مطار إيبيزا مع عبّارة فورمينتيرا</h2><p>هذه الخدمة تغطي النقل البري الخاص من مطار إيبيزا إلى الميناء أو محطة العبّارة التي تم تأكيدها. أرسل رقم الرحلة ووقت الوصول المتوقع وعدد الركاب والأمتعة ومعلومات العبّارة المتوفرة لديك. تذاكر العبّارة ليست جزءاً من خدمة النقل البري ويجب حجزها بشكل منفصل.</p><p>قد تتغير مواعيد الطيران وحركة المرور وتشغيل العبّارات، لذلك من الأفضل وجود وقت احتياطي مناسب وعدم اعتبار اللحاق بعبّارة محددة مضموناً من خلال خدمة السيارة. إذا تأخرت الرحلة أو تغير موعد العبّارة، أرسل التحديث في أقرب وقت. في رحلة العودة، يمكن إرسال وقت وصول العبّارة المتوقع إلى إيبيزا وبيانات رحلة الطيران ليتم تخطيط النقل من الميناء إلى المطار وتأكيده بشكل منفصل.</p></div></section>''',
            'de/guides/privatchauffeur-ibiza-deutschland-schweiz-2026/index.html': '''<section class="section seo-route-planning"><div class="wrap"><h2>Welche Angaben helfen bei einer internationalen Buchung?</h2><p>Für eine Anfrage aus Deutschland oder der Schweiz sind Reisedaten, Hotel oder Villa, Passagierzahl, Gepäck und die geplanten Fahrtzeiten besonders hilfreich. Bei mehreren Servicetagen kann der Ablauf als ein gemeinsamer Reiseplan gesendet werden. Änderungen bleiben von Fahrzeugverfügbarkeit und erneuter Bestätigung abhängig. So lassen sich Flughafen, Restaurants, Marinas und weitere Fahrten auf Ibiza übersichtlich koordinieren, ohne einzelne Bewegungen erst vor Ort organisieren zu müssen.</p></div></section>'''
          }

          def add_section(path, html):
              p = Path(path)
              if not p.exists():
                  skipped.append(f'missing section file: {path}')
                  return
              text = p.read_text(encoding='utf-8')
              if 'seo-route-planning' in text:
                  return
              lower = text.lower()
              marker = '</main>' if '</main>' in lower else ('</body>' if '</body>' in lower else None)
              if not marker:
                  skipped.append(f'no insertion marker: {path}')
                  return
              idx = lower.rfind(marker)
              p.write_text(text[:idx] + html + text[idx:], encoding='utf-8')
              changed.add(path)

          for path, html in localized_sections.items():
              add_section(path, html)

          # Add lightweight WebPage schema where legal/privacy HTML pages exist.
          simple_schema = {
            'legal-notice/index.html': ('es', 'Legal Notice | Ibiza Private Drivers', SITE + 'legal-notice/'),
            'privacy/index.html': ('en', 'Privacy Policy | Ibiza Private Drivers', SITE + 'privacy/'),
          }
          for path, (lang, name, url) in simple_schema.items():
              p = Path(path)
              if not p.exists():
                  skipped.append(f'missing legal page: {path}')
                  continue
              text = p.read_text(encoding='utf-8')
              if 'application/ld+json' not in text:
                  data = {'@context':'https://schema.org','@type':'WebPage','url':url,'name':name,'inLanguage':lang,'isPartOf':{'@type':'WebSite','url':SITE,'name':'Ibiza Private Drivers'}}
                  script = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '</script>\n'
                  new, n = re.subn(r'</head>', script + '</head>', text, count=1, flags=re.I)
                  if n:
                      p.write_text(new, encoding='utf-8')
                      changed.add(path)
                  else:
                      skipped.append(f'no head marker: {path}')

          # Explicit favicon for blog hub if absent.
          p = Path('blog/index.html')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              if 'rel="icon"' not in text:
                  new, n = re.subn(r'</head>', '<link rel="icon" href="/favicon.ico" sizes="any">\n</head>', text, count=1, flags=re.I)
                  if n:
                      p.write_text(new, encoding='utf-8')
                      changed.add('blog/index.html')

          def url_for(path):
              if path == 'index.html': return SITE
              if path.endswith('/index.html'): return SITE + path[:-10]
              return SITE + path

          urls = {url_for(path) for path in changed}
          for sitemap_name in ('sitemap.xml', 'sitemap-priority.xml'):
              sp = Path(sitemap_name)
              if not sp.exists(): continue
              text = sp.read_text(encoding='utf-8')
              for url in urls:
                  pattern = rf'(<loc>{re.escape(url)}</loc><lastmod>)[^<]+(</lastmod>)'
                  text = re.sub(pattern, rf'\g<1>2026-09-17\g<2>', text, count=1)
              sp.write_text(text, encoding='utf-8')

          print(f'Changed pages: {len(changed)}')
          if skipped:
              print('Skipped items:')
              for item in skipped:
                  print('-', item)
          PY

      - name: Commit SEO content fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve metadata and multilingual route depth'
          git push
